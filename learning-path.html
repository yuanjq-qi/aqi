<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习路径 - 袁佳琪的个人页面</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans SC', sans-serif; }
        .path-card { transition: transform 0.3s ease, box-shadow 0.3s ease; }
        .path-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="bg-gradient-to-br from-pink-50 via-purple-50 to-blue-50">
    <!-- 导航栏 -->
    <nav class="bg-white/80 backdrop-blur-md shadow-md">
        <div class="container mx-auto px-4 py-3">
            <div class="flex justify-between items-center">
                <a href="index.html" class="text-xl font-bold text-purple-500">袁佳琪的个人页面</a>
                <div class="hidden md:flex space-x-6">
                    <a href="index.html" class="text-gray-700 hover:text-purple-500 transition-colors">首页</a>
                    <a href="index.html#courses" class="text-gray-700 hover:text-purple-500 transition-colors">课程</a>
                    <a href="learning-path.html" class="text-purple-500 font-semibold">学习路径</a>
                    <a href="wrong-questions.html" class="text-gray-700 hover:text-purple-500 transition-colors">错题本</a>
                </div>
                <button class="md:hidden text-gray-700">
                    <i class="fa fa-bars"></i>
                </button>
            </div>
            <div id="mobileMenu" class="hidden md:hidden mt-4 pb-4 space-y-3">
                <a href="index.html" class="block text-gray-700 hover:text-purple-500">首页</a>
                <a href="index.html#courses" class="block text-gray-700 hover:text-purple-500">课程</a>
                <a href="learning-path.html" class="block text-purple-500 font-semibold">学习路径</a>
                <a href="wrong-questions.html" class="block text-gray-700 hover:text-purple-500">错题本</a>
            </div>
        </div>
    </nav>

    <!-- 学习路径标题 -->
    <header class="bg-gradient-to-r from-pink-400 via-purple-400 to-blue-400 text-white py-12">
        <div class="container mx-auto px-4 text-center">
            <h1 class="text-3xl md:text-4xl font-bold mb-4">学习路径</h1>
            <p class="text-lg md:text-xl">循序渐进，不断进步！</p>
        </div>
    </header>

    <!-- 学习路径内容 -->
    <section class="py-12">
        <div class="container mx-auto px-4">
            <h2 class="text-2xl font-bold text-center mb-10 text-purple-600">我的学习项目</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                <!-- Python基础练习 -->
                <a href="practice/python-basics.html" class="path-card bg-white rounded-2xl shadow-lg p-6 border border-pink-100">
                    <div class="text-pink-500 text-4xl mb-4"><i class="fa fa-code"></i></div>
                    <h3 class="text-xl font-semibold mb-2 text-purple-700">Python基础练习</h3>
                    <p class="text-gray-600">巩固Python编程基础，掌握核心概念</p>
                </a>
                
                <!-- 数据分析练习 -->
                <a href="practice/data-analysis.html" class="path-card bg-white rounded-2xl shadow-lg p-6 border border-blue-100">
                    <div class="text-blue-500 text-4xl mb-4"><i class="fa fa-bar-chart"></i></div>
                    <h3 class="text-xl font-semibold mb-2 text-purple-700">数据分析练习</h3>
                    <p class="text-gray-600">实战数据分析技能，提升数据处理能力</p>
                </a>
                
                <!-- 数据采集练习 -->
                <a href="practice/data-collection.html" class="path-card bg-white rounded-2xl shadow-lg p-6 border border-green-100">
                    <div class="text-green-500 text-4xl mb-4"><i class="fa fa-database"></i></div>
                    <h3 class="text-xl font-semibold mb-2 text-purple-700">数据采集练习</h3>
                    <p class="text-gray-600">学习网络爬虫和数据采集技术</p>
                </a>
            </div>
        </div>
    </section>

    <!-- 综合考试 -->
    <section class="py-12 bg-gradient-to-r from-purple-500 via-pink-500 to-yellow-500">
        <div class="container mx-auto px-4">
            <div class="text-center">
                <div class="text-white text-5xl mb-6"><i class="fa fa-graduation-cap"></i></div>
                <h2 class="text-3xl font-bold text-white mb-4">综合考试</h2>
                <p class="text-white text-lg mb-8 max-w-2xl mx-auto">检验你的学习成果！完成10道综合题目，涵盖Python、数据分析、数据采集等多个领域</p>
                <a href="practice/exam.html" class="bg-white text-purple-600 px-8 py-4 rounded-xl hover:bg-gray-100 transition-all font-semibold text-lg inline-flex items-center shadow-lg">
                    <i class="fa fa-trophy mr-2"></i>开始考试
                </a>
            </div>
        </div>
    </section>

    <!-- 页脚 -->
    <footer class="bg-gradient-to-r from-purple-500 to-pink-500 text-white py-8 mt-12">
        <div class="container mx-auto px-4 text-center">
            <p>&copy; 2026 袁佳琪的个人页面</p>
        </div>
    </footer>

    <script src="js/utils.js"></script>
</body>
</html>
