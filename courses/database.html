<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据库原理与应用练习 - 袁佳琪的个人页面</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="../js/utils.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans SC', sans-serif; }
        .option-btn { transition: all 0.3s ease; cursor: pointer; }
        .option-btn:hover:not(.selected):not(.disabled) { transform: translateX(5px); border-color: #a855f7; background-color: #f3e8ff; }
        .option-btn.selected { border-color: #a855f7; background-color: #f3e8ff; }
        .option-btn.correct { border-color: #22c55e !important; background-color: #dcfce7 !important; }
        .option-btn.wrong { border-color: #ef4444 !important; background-color: #fee2e2 !important; }
        .option-btn.disabled { cursor: not-allowed; opacity: 0.7; }
    </style>
</head>
<body class="bg-gradient-to-br from-pink-50 via-purple-50 to-blue-50">
    <nav class="bg-white/80 backdrop-blur-md shadow-md">
        <div class="container mx-auto px-4 py-3">
            <div class="flex justify-between items-center">
                <a href="../index.html" class="text-xl font-bold text-purple-500">袁佳琪的个人页面</a>
                <div class="hidden md:flex space-x-6">
                    <a href="../index.html" class="text-gray-700 hover:text-purple-500 transition-colors">首页</a>
                    <a href="../index.html#courses" class="text-gray-700 hover:text-purple-500 transition-colors">课程</a>
                    <a href="database.html" class="text-purple-500 font-semibold">数据库原理与应用</a>
                </div>
                <button class="md:hidden text-gray-700" onclick="toggleMobileMenu()"><i class="fa fa-bars"></i></button>
            </div>
            <div id="mobileMenu" class="hidden md:hidden mt-4 pb-4 space-y-3">
                <a href="../index.html" class="block text-gray-700 hover:text-purple-500">首页</a>
                <a href="../index.html#courses" class="block text-gray-700 hover:text-purple-500">课程</a>
                <a href="database.html" class="block text-purple-500 font-semibold">数据库原理与应用</a>
            </div>
        </div>
    </nav>

    <header class="bg-gradient-to-r from-pink-400 via-purple-400 to-blue-400 text-white py-12">
        <div class="container mx-auto px-4 text-center">
            <h1 class="text-3xl md:text-4xl font-bold mb-4">数据库原理与应用</h1>
            <p class="text-lg md:text-xl">课程练习题</p>
        </div>
    </header>

    <section class="py-8 bg-white border-b border-purple-100">
        <div class="container mx-auto px-4">
            <div class="max-w-3xl mx-auto">
                <h2 class="text-2xl font-bold mb-4 text-purple-700">课程简介</h2>
                <p class="text-gray-600 mb-4">数据库原理与应用课程主要学习数据库设计和SQL查询。内容包括数据库系统概论、关系数据库、SQL语言、数据库设计、事务管理等。学生将掌握使用数据库管理系统进行数据存储、查询和管理的能力。</p>
            </div>
        </div>
    </section>

    <div class="bg-purple-200 h-2"><div id="progressBar" class="bg-gradient-to-r from-pink-400 to-purple-500 h-2 transition-all duration-500" style="width: 0%"></div></div>

    <section class="py-12">
        <div class="container mx-auto px-4">
            <div class="max-w-3xl mx-auto">
                <div id="statusBar" class="bg-white rounded-2xl shadow-lg p-6 mb-8 border border-blue-100">
                    <div class="flex justify-between items-center mb-4">
                        <div class="text-lg"><span class="font-semibold text-gray-800">第 <span id="currentQuestionNum" class="text-purple-600">1</span> 题</span><span class="text-gray-500">/ 共 <span id="totalQuestionsNum">10</span> 题</span></div>
                        <div id="questionType" class="bg-purple-100 text-purple-600 px-3 py-1 rounded-full text-sm font-semibold">单选题</div>
                    </div>
                    <div class="flex items-center justify-between">
                        <div class="text-gray-600"><i class="fa fa-check-circle text-green-500 mr-1"></i>正确: <span id="correctCount" class="font-semibold text-green-600">0</span></div>
                        <div class="text-gray-600"><i class="fa fa-times-circle text-red-500 mr-1"></i>错误: <span id="wrongCount" class="font-semibold text-red-600">0</span></div>
                        <div class="text-gray-600"><i class="fa fa-clock-o text-blue-500 mr-1"></i>未答: <span id="unansweredCount" class="font-semibold text-gray-600">10</span></div>
                    </div>
                </div>

                <div id="questionContainer" class="bg-white rounded-2xl shadow-lg p-8 mb-8 border border-purple-100"></div>

                <div class="flex flex-wrap justify-between gap-4">
                    <button id="prevBtn" onclick="prevQuestion()" class="bg-gray-400 text-white px-6 py-3 rounded-xl hover:bg-gray-500 transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center"><i class="fa fa-arrow-left mr-2"></i>上一题</button>
                    <button id="submitAllBtn" onclick="submitAll()" class="bg-gradient-to-r from-green-400 to-emerald-500 text-white px-6 py-3 rounded-xl hover:from-green-500 hover:to-emerald-600 transition-colors hidden flex items-center shadow-md"><i class="fa fa-paper-plane mr-2"></i>提交全部</button>
                    <button id="nextBtn" onclick="nextQuestion()" class="bg-gradient-to-r from-pink-400 to-purple-500 text-white px-6 py-3 rounded-xl hover:from-pink-500 hover:to-purple-600 transition-colors flex items-center shadow-md">下一题<i class="fa fa-arrow-right ml-2"></i></button>
                </div>

                <div id="answerSheet" class="mt-8 bg-white rounded-2xl shadow-lg p-6 border border-blue-100">
                    <h3 class="text-lg font-semibold mb-4 text-purple-700"><i class="fa fa-list-ul mr-2"></i>答题卡</h3>
                    <div id="answerCards" class="flex flex-wrap gap-3"></div>
                </div>
            </div>
        </div>
    </section>

    <section id="resultSection" class="py-12 hidden">
        <div class="container mx-auto px-4">
            <div class="max-w-3xl mx-auto">
                <div class="bg-white rounded-2xl shadow-lg p-8 text-center border border-purple-100">
                    <div id="resultIcon" class="text-7xl mb-6"></div>
                    <h2 class="text-3xl font-bold mb-4 text-purple-700">练习完成！</h2>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                        <div class="bg-pink-50 rounded-xl p-4 border border-pink-100"><div class="text-3xl font-bold text-pink-600" id="finalScore">0</div><div class="text-gray-600">得分</div></div>
                        <div class="bg-green-50 rounded-xl p-4 border border-green-100"><div class="text-3xl font-bold text-green-600" id="finalCorrect">0</div><div class="text-gray-600">正确</div></div>
                        <div class="bg-red-50 rounded-xl p-4 border border-red-100"><div class="text-3xl font-bold text-red-600" id="finalWrong">0</div><div class="text-gray-600">错误</div></div>
                        <div class="bg-purple-50 rounded-xl p-4 border border-purple-100"><div class="text-3xl font-bold text-purple-600" id="finalRate">0%</div><div class="text-gray-600">正确率</div></div>
                    </div>
                    <div id="gradeSection" class="mb-8"><div class="text-xl mb-2">评级：<span id="finalGrade" class="font-bold text-2xl"></span></div><p id="gradeMessage" class="text-gray-600"></p></div>
                    <div id="wrongQuestions" class="mt-8 text-left hidden">
                        <h3 class="text-xl font-bold mb-4 text-red-600"><i class="fa fa-exclamation-triangle mr-2"></i>错题汇总</h3>
                        <div id="wrongQuestionsList" class="space-y-4"></div>
                    </div>
                    <div class="flex flex-wrap justify-center gap-4 mt-8">
                        <button onclick="restartQuiz()" class="bg-gradient-to-r from-purple-500 to-pink-500 text-white px-8 py-3 rounded-xl hover:from-purple-600 hover:to-pink-600 transition-colors shadow-md"><i class="fa fa-refresh mr-2"></i>重新练习</button>
                        <a href="../index.html" class="bg-gray-200 text-gray-700 px-8 py-3 rounded-xl hover:bg-gray-300 transition-colors inline-block"><i class="fa fa-home mr-2"></i>返回首页</a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="bg-gradient-to-r from-purple-500 to-pink-500 text-white py-8 mt-12"><div class="container mx-auto px-4 text-center"><p>&copy; 2026 袁佳琪的个人页面</p></div></footer>

    <script>
        const COURSE_ID = 'database';
        const questions = [
            {id:1,type:1,title:'关系数据库',question:'关系数据库中的"关系"是指？',options:[{label:'A',text:'表与表之间的连接',isCorrect:true},{label:'B',text:'数据的逻辑结构',isCorrect:false},{label:'C',text:'数据的物理存储',isCorrect:false},{label:'D',text:'用户与数据库的连接',isCorrect:false}],explanation:'关系数据库中的"关系"指的是表与表之间的关联,通过主键和外键建立联系。'},
            {id:2,type:1,title:'主键',question:'以下哪个是主键应满足的条件？',options:[{label:'A',text:'可以为空',isCorrect:false},{label:'B',text:'允许重复',isCorrect:false},{label:'C',text:'唯一且非空',isCorrect:true},{label:'D',text:'可以有多列',isCorrect:false}],explanation:'主键是用来唯一标识表中每一条记录的字段,必须唯一且不能为空。'},
            {id:3,type:1,title:'SELECT语句',question:'在SQL中,用于查询数据的语句是？',options:[{label:'A',text:'INSERT',isCorrect:false},{label:'B',text:'UPDATE',isCorrect:false},{label:'C',text:'SELECT',isCorrect:true},{label:'D',text:'DELETE',isCorrect:false}],explanation:'SELECT语句用于从数据库中查询数据,是最常用的SQL语句。'},
            {id:4,type:1,title:'WHERE子句',question:'SQL中,WHERE子句的作用是？',options:[{label:'A',text:'分组数据',isCorrect:false},{label:'B',text:'排序数据',isCorrect:false},{label:'C',text:'过滤数据',isCorrect:true},{label:'D',text:'连接表',isCorrect:false}],explanation:'WHERE子句用于指定查询条件,过滤出满足条件的记录。'},
            {id:5,type:1,title:'JOIN连接',question:'INNER JOIN返回的是？',options:[{label:'A',text:'左表所有记录',isCorrect:false},{label:'B',text:'右表所有记录',isCorrect:false},{label:'C',text:'两表匹配的所有记录',isCorrect:true},{label:'D',text:'两表所有记录',isCorrect:false}],explanation:'INNER JOIN(内连接)只返回两表中匹配成功的记录。'},
            {id:6,type:2,title:'SQL操作(多选)',question:'SQL的基本操作包括?(多选)',options:[{label:'A',text:'INSERT(插入)',isCorrect:true},{label:'B',text:'UPDATE(更新)',isCorrect:true},{label:'C',text:'DELETE(删除)',isCorrect:true},{label:'D',text:'COPY(复制)',isCorrect:false}],explanation:'SQL基本操作是CRUD:Create(INSERT)、Read(SELECT)、Update(UPDATE)、Delete(DELETE)。'},
            {id:7,type:1,title:'聚合函数',question:'COUNT函数的作用是？',options:[{label:'A',text:'求和',isCorrect:false},{label:'B',text:'求平均值',isCorrect:false},{label:'C',text:'计数',isCorrect:true},{label:'D',text:'求最大值',isCorrect:false}],explanation:'COUNT函数用于统计记录数量,SUM求和,AVG求平均值,MAX求最大值。'},
            {id:8,type:1,title:'GROUP BY',question:'SQL中,GROUP BY子句通常与什么一起使用?',options:[{label:'A',text:'WHERE',isCorrect:false},{label:'B',text:'ORDER BY',isCorrect:false},{label:'C',text:'聚合函数',isCorrect:true},{label:'D',text:'JOIN',isCorrect:false}],explanation:'GROUP BY用于将数据分组,通常与聚合函数一起使用来对每个组进行统计。'},
            {id:9,type:2,title:'范式(多选)',question:'数据库规范化的主要目的包括?(多选)',options:[{label:'A',text:'消除数据冗余',isCorrect:true},{label:'B',text:'避免数据异常',isCorrect:true},{label:'C',text:'提高查询速度',isCorrect:false},{label:'D',text:'简化数据操作',isCorrect:true}],explanation:'规范化主要目的是消除数据冗余、避免插入/更新/删除异常,简化数据操作。提高查询速度可能需要反规范化。'},
            {id:10,type:1,title:'索引',question:'创建索引的主要目的是？',options:[{label:'A',text:'占用更多存储空间',isCorrect:false},{label:'B',text:'加快查询速度',isCorrect:true},{label:'C',text:'保证数据唯一性',isCorrect:false},{label:'D',text:'建立表之间的联系',isCorrect:false}],explanation:'索引就像书的目录,可以加快数据查询速度,但会占用额外的存储空间。'}
        ];

        let currentIndex=0,userAnswers=new Array(questions.length).fill(null),correctCount=0,wrongCount=0,isSubmitted=false;

        function init(){renderQuestion();updateAnswerCards();updateStatus();}

        function renderQuestion(){
            const q=questions[currentIndex],container=document.getElementById('questionContainer'),typeLabel=document.getElementById('questionType');
            typeLabel.textContent=q.type===1?'单选题':'多选题';
            typeLabel.className=q.type===1?'bg-purple-100 text-purple-600 px-3 py-1 rounded-full text-sm font-semibold':'bg-pink-100 text-pink-600 px-3 py-1 rounded-full text-sm font-semibold';
            let optionsHtml='';
            q.options.forEach((opt,index)=>{
                const isSelected=userAnswers[currentIndex]!==null&&(q.type===1?userAnswers[currentIndex]===index:userAnswers[currentIndex].includes(index));
                let optionClass='option-btn w-full text-left p-4 border-2 border-gray-200 rounded-xl mb-3';
                if(isSelected)optionClass+=' selected';
                if(isSubmitted&&opt.isCorrect)optionClass+=' correct';
                if(isSubmitted&&isSelected&&!opt.isCorrect)optionClass+=' wrong';
                if(isSubmitted)optionClass+=' disabled';
                const checkbox=q.type===2?`<span class="inline-block w-5 h-5 border-2 border-gray-300 rounded mr-3 ${isSelected?'bg-purple-500 border-purple-500':''}"></span>`:'';
                optionsHtml+=`<div class="${optionClass}" onclick="selectOption(${index})"><span class="font-semibold mr-3">${opt.label}.</span>${checkbox}${opt.text}</div>`;
            });
            container.innerHTML=`<h2 class="text-2xl font-semibold mb-6 text-gray-800"><span class="text-purple-600">${q.id}.</span> ${q.title}</h2><div class="mb-6"><p class="text-gray-700 text-lg">${q.question}</p>${q.type===2?'<p class="text-sm text-gray-500 mt-2">（多选题，至少选择一个答案）</p>':''}</div><div class="space-y-2">${optionsHtml}</div>${isSubmitted?`<div class="mt-6 p-4 bg-purple-50 rounded-xl border-l-4 border-purple-500"><p class="text-gray-700"><strong class="text-purple-600"><i class="fa fa-lightbulb-o mr-1"></i>解析：</strong>${q.explanation}</p></div>`:''}`;
            document.getElementById('prevBtn').disabled=currentIndex===0;
            if(currentIndex===questions.length-1&&userAnswers.every(a=>a!==null)){document.getElementById('nextBtn').classList.add('hidden');document.getElementById('submitAllBtn').classList.remove('hidden');}
            else{document.getElementById('nextBtn').classList.remove('hidden');document.getElementById('submitAllBtn').classList.add('hidden');}
        }

        function selectOption(index){
            if(isSubmitted)return;
            const q=questions[currentIndex];
            if(q.type===1)userAnswers[currentIndex]=index;
            else{
                if(userAnswers[currentIndex]===null)userAnswers[currentIndex]=[];
                const idx=userAnswers[currentIndex].indexOf(index);
                if(idx>-1)userAnswers[currentIndex].splice(idx,1);
                else userAnswers[currentIndex].push(index);
                userAnswers[currentIndex].sort((a,b)=>a-b);
            }
            renderQuestion();updateAnswerCards();updateStatus();
        }

        function prevQuestion(){if(currentIndex>0){currentIndex--;renderQuestion();updateAnswerCards();}}
        function nextQuestion(){if(currentIndex<questions.length-1){currentIndex++;renderQuestion();updateAnswerCards();}}
        function goToQuestion(index){currentIndex=index;renderQuestion();updateAnswerCards();}

        function updateAnswerCards(){
            const container=document.getElementById('answerCards');container.innerHTML='';
            questions.forEach((q,index)=>{
                let cardClass='w-10 h-10 rounded-xl flex items-center justify-center font-semibold cursor-pointer transition-all';
                if(userAnswers[index]!==null){const isCorrect=isAnswerCorrect(index);cardClass+=isCorrect?' bg-green-500 text-white':' bg-red-500 text-white';}
                else cardClass+=' bg-gray-200 text-gray-600 hover:bg-gray-300';
                if(index===currentIndex)cardClass+=' ring-2 ring-purple-500';
                container.innerHTML+=`<div class="${cardClass}" onclick="goToQuestion(${index})" title="第${index+1}题">${index+1}</div>`;
            });
        }

        function updateStatus(){
            correctCount=0;wrongCount=0;
            userAnswers.forEach((answer,index)=>{if(answer!==null){if(isAnswerCorrect(index))correctCount++;else wrongCount++;}});
            document.getElementById('currentQuestionNum').textContent=currentIndex+1;
            document.getElementById('totalQuestionsNum').textContent=questions.length;
            document.getElementById('correctCount').textContent=correctCount;
            document.getElementById('wrongCount').textContent=wrongCount;
            document.getElementById('unansweredCount').textContent=questions.length-userAnswers.filter(a=>a!==null).length;
            document.getElementById('progressBar').style.width=`${(userAnswers.filter(a=>a!==null).length/questions.length)*100}%`;
        }

        function isAnswerCorrect(questionIndex){
            const q=questions[questionIndex],userAnswer=userAnswers[questionIndex];
            if(q.type===1)return q.options[userAnswer].isCorrect;
            else{const correctIndices=q.options.reduce((acc,opt,idx)=>{if(opt.isCorrect)acc.push(idx);return acc;},[]);if(userAnswer.length!==correctIndices.length)return false;return userAnswer.every(idx=>correctIndices.includes(idx));}
        }

        function submitAll(){isSubmitted=true;showResults();}

        function showResults(){
            const wrongQuestions = [];
            userAnswers.forEach((answer, index) => {
                if (answer !== null && !isAnswerCorrect(index)) {
                    const q = questions[index];
                    const userAnswerText = q.type === 1 ? q.options[answer].text : answer.map(i => q.options[i].text).join('、');
                    const correctAnswerText = q.options.filter(o => o.isCorrect).map(o => o.text).join('、');
                    wrongQuestions.push({
                        questionId: q.id,
                        question: q.question,
                        userAnswer: userAnswerText,
                        correctAnswer: correctAnswerText,
                        explanation: q.explanation
                    });
                }
            });
            StorageManager.saveQuizResult(COURSE_ID, { score: correctCount, total: questions.length, wrongQuestions: wrongQuestions });

            document.getElementById('resultSection').classList.remove('hidden');
            document.querySelector('section.py-12').classList.add('hidden');
            const score=correctCount,total=questions.length,rate=Math.round((score/total)*100);
            document.getElementById('finalScore').textContent=`${score}/${total}`;
            document.getElementById('finalCorrect').textContent=correctCount;
            document.getElementById('finalWrong').textContent=wrongCount;
            document.getElementById('finalRate').textContent=`${rate}%`;
            let grade='',message='',icon='';
            if(rate>=90){grade='优秀';message='太棒了！你对数据库原理与应用掌握得非常扎实！';icon='🏆';}
            else if(rate>=80){grade='良好';message='非常出色！继续保持！';icon='🎉';}
            else if(rate>=70){grade='中等';message='不错！还有一些细节需要加强。';icon='👍';}
            else if(rate>=60){grade='及格';message='刚好及格，建议复习一下。';icon='💪';}
            else{grade='需努力';message='加油！多做练习，你会进步的！';icon='📚';}
            document.getElementById('resultIcon').textContent=icon;
            document.getElementById('finalGrade').textContent=grade;
            document.getElementById('finalGrade').className=`font-bold text-2xl ${rate>=90?'text-green-600':rate>=70?'text-purple-600':rate>=60?'text-yellow-600':'text-red-600'}`;
            document.getElementById('gradeMessage').textContent=message;
            const wrongQuestionsContainer=document.getElementById('wrongQuestions'),wrongQuestionsList=document.getElementById('wrongQuestionsList');
            const wrongIndices=[];userAnswers.forEach((answer,index)=>{if(answer!==null&&!isAnswerCorrect(index))wrongIndices.push(index);});
            if(wrongIndices.length>0){wrongQuestionsContainer.classList.remove('hidden');wrongQuestionsList.innerHTML='';wrongIndices.forEach(index=>{const q=questions[index],userAnswer=userAnswers[index];let userAnswerText=q.type===1?q.options[userAnswer].text:userAnswer.map(i=>q.options[i].text).join('、');const correctAnswerText=q.options.filter(o=>o.isCorrect).map(o=>o.text).join('、');wrongQuestionsList.innerHTML+=`<div class="bg-red-50 rounded-xl p-4 border-l-4 border-red-500"><div class="font-semibold text-gray-800 mb-2">${index+1}. ${q.title}</div><div class="text-gray-600 text-sm mb-2"><strong>你的答案：</strong>${userAnswerText}</div><div class="text-green-600 text-sm mb-2"><strong>正确答案：</strong>${correctAnswerText}</div><div class="text-purple-600 text-sm"><strong>解析：</strong>${q.explanation}</div></div>`;});}
            else wrongQuestionsContainer.classList.add('hidden');
            document.getElementById('resultSection').scrollIntoView({behavior:'smooth'});
        }

        function restartQuiz(){currentIndex=0;userAnswers=new Array(questions.length).fill(null);correctCount=0;wrongCount=0;isSubmitted=false;document.getElementById('resultSection').classList.add('hidden');document.querySelector('section.py-12').classList.remove('hidden');document.getElementById('progressBar').style.width='0%';init();}
        function toggleMobileMenu(){document.getElementById('mobileMenu').classList.toggle('hidden');}
        init();
    </script>
</body>
</html>
