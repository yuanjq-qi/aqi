            </div>

    <div class="bg-purple-200 h-2"><div id="progressBar" class="bg-gradient-to-r from-pink-400 to-purple-500 h-2 transition-all duration-500" style="width: 0%"></div></div>

    <section class="py-12">
        <div class="container mx-auto px-4">
            <div class="max-w-3xl mx-auto">
                <div id="statusBar" class="bg-white rounded-2xl shadow-lg p-6 mb-8 border border-blue-100">
                    <div class="flex justify-between items-center mb-4">
                        <div class="text-lg"><span class="font-semibold text-gray-800">第 <span id="currentQuestionNum" class="text-purple-600">1</span> 题</span><span class="text-gray-500">/ 共 <span id="totalQuestionsNum">10</span> 题</span></div>
                        <div id="questionType" class="bg-purple-100 text-purple-600 px-3 py-1 rounded-full text-sm font-semibold">单选题</div>
                    </div>
                    <div class="flex items-center justify-between">
                        <div class="text-gray-600"><i class="fa fa-check-circle text-green-500 mr-1"></i>正确: <span id="correctCount" class="font-semibold text-green-600">0</span></div>
                        <div class="text-gray-600"><i class="fa fa-times-circle text-red-500 mr-1"></i>错误: <span id="wrongCount" class="font-semibold text-red-600">0</span></div>
                        <div class="text-gray-600"><i class="fa fa-clock-o text-blue-500 mr-1"></i>未答: <span id="unansweredCount" class="font-semibold text-gray-600">10</span></div>

                    <button id="submitAllBtn" onclick="submitAll()" class="bg-gradient-to-r from-green-400 to-emerald-500 text-white px-6 py-3 rounded-xl hover:from-green-500 hover:to-emerald-600 transition-colors hidden flex items-center shadow-md"><i class="fa fa-paper-plane mr-2"></i>提交全部</button>

    <section id="resultSection" class="py-12 hidden">

                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">

                        <div class="bg-green-50 rounded-xl p-4 border border-green-100"><div class="text-3xl font-bold text-green-600" id="finalCorrect">0</div><div class="text-gray-600">正确</div></div>
                        <div class="bg-red-50 rounded-xl p-4 border border-red-100"><div class="text-3xl font-bold text-red-600" id="finalWrong">0</div><div class="text-gray-600">错误</div></div>
                        <div class="bg-purple-50 rounded-xl p-4 border border-purple-100"><div class="text-3xl font-bold text-purple-600" id="finalRate">0%</div><div class="text-gray-600">正确率</div></div>
                    </div>
                    <div id="gradeSection" class="mb-8"><div class="text-xl mb-2">评级：<span id="finalGrade" class="font-bold text-2xl"></span></div><p id="gradeMessage" class="text-gray-600"></p></div>

                        <a href="../index.html" class="bg-gray-200 text-gray-700 px-8 py-3 rounded-xl hover:bg-gray-300 transition-colors inline-block"><i class="fa fa-home mr-2"></i>返回首页</a>

    <footer class="bg-gradient-to-r from-purple-500 to-pink-500 text-white py-8 mt-12"><div class="container mx-auto px-4 text-center"><p>&copy; 2026 袁佳琪的个人页面</p></div></footer>

    <script>
        const COURSE_ID = 'database';
                const questions = [
            { id: 1, type: 1, title: '关系数据库', question: '关系数据库中的"关系"是指？', options: [{ label: 'A', text: '表与表之间的关联', isCorrect: true }, { label: 'B', text: '数据的逻辑结构', isCorrect: false }, { label: 'C', text: '数据的物理存储', isCorrect: false }, { label: 'D', text: '用户与数据库的连接', isCorrect: false }], explanation: '关系数据库中的"关系"指的是表与表之间通过主键和外键建立的数据关联。' },
            { id: 2, type: 1, title: '主键约束', question: '以下哪个是主键（PRIMARY KEY）应满足的条件？', options: [{ label: 'A', text: '可以为空', isCorrect: false }, { label: 'B', text: '允许重复', isCorrect: false }, { label: 'C', text: '唯一且非空', isCorrect: true }, { label: 'D', text: '可以有多列值相同', isCorrect: false }], explanation: '主键用于唯一标识表中的每一条记录，必须满足唯一且不能为空（NOT NULL + UNIQUE）。' },
            { id: 3, type: 1, title: 'SELECT语句', question: '在SQL中，用于查询数据的关键字是？', options: [{ label: 'A', text: 'INSERT', isCorrect: false }, { label: 'B', text: 'UPDATE', isCorrect: false }, { label: 'C', text: 'SELECT', isCorrect: true }, { label: 'D', text: 'DELETE', isCorrect: false }], explanation: 'SELECT语句用于从数据库中查询数据，是最常用的SQL语句。' },
            { id: 4, type: 1, title: 'WHERE子句', question: 'SQL中，WHERE子句的作用是？', options: [{ label: 'A', text: '分组数据', isCorrect: false }, { label: 'B', text: '排序数据', isCorrect: false }, { label: 'C', text: '过滤数据', isCorrect: true }, { label: 'D', text: '连接表', isCorrect: false }], explanation: 'WHERE子句用于指定查询条件，过滤出满足条件的记录行。' },
            { id: 5, type: 1, title: 'JOIN连接', question: 'INNER JOIN返回的结果是？', options: [{ label: 'A', text: '左表所有记录', isCorrect: false }, { label: 'B', text: '右表所有记录', isCorrect: false }, { label: 'C', text: '两表匹配的记录', isCorrect: true }, { label: 'D', text: '两表所有记录', isCorrect: false }], explanation: 'INNER JOIN（内连接）只返回两个表中连接条件匹配成功的记录。' },
            { id: 6, type: 1, title: '聚合函数', question: 'COUNT函数的作用是？', options: [{ label: 'A', text: '求和', isCorrect: false }, { label: 'B', text: '求平均值', isCorrect: false }, { label: 'C', text: '计数', isCorrect: true }, { label: 'D', text: '求最大值', isCorrect: false }], explanation: 'COUNT函数用于统计记录数量，SUM求和，AVG求平均值，MAX/MIN求最大/最小值。' },
            { id: 7, type: 1, title: 'GROUP BY', question: 'SQL中，GROUP BY子句的作用是？', options: [{ label: 'A', text: '过滤数据', isCorrect: false }, { label: 'B', text: '对数据分组', isCorrect: true }, { label: 'C', text: '排序数据', isCorrect: false }, { label: 'D', text: '限制行数', isCorrect: false }], explanation: 'GROUP BY用于将数据按指定列分组，通常与聚合函数配合使用进行分组统计。' },
            { id: 8, type: 1, title: 'ORDER BY', question: 'SQL中，ORDER BY子句的默认排序方式是？', options: [{ label: 'A', text: '降序（DESC）', isCorrect: false }, { label: 'B', text: '升序（ASC）', isCorrect: true }, { label: 'C', text: '随机排序', isCorrect: false }, { label: 'D', text: '不排序', isCorrect: false }], explanation: 'ORDER BY默认使用升序（ASC）排序，可以指定DESC进行降序排序。' },
            { id: 9, type: 1, title: '插入数据', question: '向表中插入新记录应该使用哪个SQL语句？', options: [{ label: 'A', text: 'INSERT INTO', isCorrect: true }, { label: 'B', text: 'UPDATE', isCorrect: false }, { label: 'C', text: 'ADD', isCorrect: false }, { label: 'D', text: 'CREATE', isCorrect: false }], explanation: 'INSERT INTO语句用于向表中插入新记录，格式为 INSERT INTO 表名(列名) VALUES(值)。' },
            { id: 10, type: 1, title: '索引', question: '创建索引的主要目的是？', options: [{ label: 'A', text: '占用更多存储空间', isCorrect: false }, { label: 'B', text: '加快查询速度', isCorrect: true }, { label: 'C', text: '保证数据唯一性', isCorrect: false }, { label: 'D', text: '建立表之间的联系', isCorrect: false }], explanation: '索引就像书的目录，通过建立数据的快速查找结构来加快查询速度，但会占用额外存储空间。' },
            { id: 11, type: 2, title: 'SQL操作（多选）', question: 'SQL的基本操作包括？（多选）', options: [{ label: 'A', text: 'INSERT（插入）', isCorrect: true }, { label: 'B', text: 'UPDATE（更新）', isCorrect: true }, { label: 'C', text: 'DELETE（删除）', isCorrect: true }, { label: 'D', text: 'SELECT（查询）', isCorrect: true }], explanation: 'SQL基本操作CRUD：Create（INSERT）、Read（SELECT）、Update（UPDATE）、Delete（DELETE）。' },
            { id: 12, type: 2, title: '数据库约束（多选）', question: '以下哪些是SQL的常用约束类型？（多选）', options: [{ label: 'A', text: 'PRIMARY KEY', isCorrect: true }, { label: 'B', text: 'FOREIGN KEY', isCorrect: true }, { label: 'C', text: 'UNIQUE', isCorrect: true }, { label: 'D', text: 'NOT NULL', isCorrect: true }], explanation: 'PRIMARY KEY主键、FOREIGN KEY外键、UNIQUE唯一、NOT NULL非空、CHECK检查都是SQL常用约束。' },
            { id: 13, type: 2, title: '查询技巧（多选）', question: '以下哪些是常用的SQL查询优化技巧？（多选）', options: [{ label: 'A', text: '合理使用索引', isCorrect: true }, { label: 'B', text: '避免SELECT *', isCorrect: true }, { label: 'C', text: '使用WHERE过滤', isCorrect: true }, { label: 'D', text: '避免全表扫描', isCorrect: true }], explanation: '合理使用索引、指定列名代替SELECT *、及早过滤、避免全表扫描都是常用的SQL优化技巧。' },
            { id: 14, type: 2, title: 'JOIN类型（多选）', question: '以下哪些是SQL的JOIN类型？（多选）', options: [{ label: 'A', text: 'INNER JOIN', isCorrect: true }, { label: 'B', text: 'LEFT JOIN', isCorrect: true }, { label: 'C', text: 'RIGHT JOIN', isCorrect: true }, { label: 'D', text: 'FULL JOIN', isCorrect: true }], explanation: 'INNER JOIN内连接、LEFT JOIN左连接、RIGHT JOIN右连接、FULL JOIN全连接都是SQL的连接类型。' },
            { id: 15, type: 2, title: '事务特性（多选）', question: '数据库事务的ACID特性包括？（多选）', options: [{ label: 'A', text: '原子性（Atomicity）', isCorrect: true }, { label: 'B', text: '一致性（Consistency）', isCorrect: true }, { label: 'C', text: '隔离性（Isolation）', isCorrect: true }, { label: 'D', text: '持久性（Durability）', isCorrect: true }], explanation: 'ACID是事务的四大特性：原子性、一致性、隔离性、持久性，保证数据库操作的可靠性。' },
            { id: 16, type: 3, title: 'SELECT查询（代码补全）', code: '___ name, age FROM students WHERE age > 18;', blanks: ['SELECT'], explanation: 'SELECT后指定要查询的列名，用逗号分隔，FROM指定表名，WHERE指定筛选条件。' },
            { id: 17, type: 3, title: '插入数据（代码补全）', code: '___ INTO users (name, age) VALUES ("Alice", 20);', blanks: ['INSERT'], explanation: 'INSERT INTO用于向表中插入新记录，指定列名和对应的值。' },
            { id: 18, type: 3, title: '更新数据（代码补全）', code: '___ users SET age = 21 WHERE name = "Alice";', blanks: ['UPDATE'], explanation: 'UPDATE用于修改表中的记录，SET子句指定要更新的列和新值，WHERE指定更新条件。' },
            { id: 19, type: 3, title: '聚合函数（代码补全）', code: 'SELECT ___(price) FROM products;', blanks: ['AVG'], explanation: '聚合函数包括AVG(平均值)、SUM(求和)、MAX(最大值)、MIN(最小值)、COUNT(计数)等。' },
            { id: 20, type: 3, title: '表连接（代码补全）', code: 'SELECT * FROM orders ___ users ON orders.user_id = users.id;', blanks: ['JOIN'], explanation: 'JOIN（或INNER JOIN）用于连接两个表，ON子句指定连接条件（通常是外键=主键）。' },
            { id: 21, type: 4, title: '主键唯一', question: '一个表只能有一个主键。', options: [{ label: 'A', text: '正确', isCorrect: true }, { label: 'B', text: '错误', isCorrect: false }], explanation: '一个表只能定义一个主键，但主键可以由多个列组成（称为复合主键）。' },
            { id: 22, type: 4, title: '索引利弊', question: '索引越多查询越快，所以应该给所有列都建索引。', options: [{ label: 'A', text: '正确', isCorrect: false }, { label: 'B', text: '错误', isCorrect: true }], explanation: '索引会占用存储空间并降低写入性能，应该根据实际查询场景选择性建立索引。' },
            { id: 23, type: 4, title: '事务回滚', question: 'ROLLBACK可以撤销已经COMMIT的事务。', options: [{ label: 'A', text: '正确', isCorrect: false }, { label: 'B', text: '错误', isCorrect: true }], explanation: 'ROLLBACK只能撤销未提交的事务，一旦使用COMMIT提交，事务结果将持久化无法回滚。' },
            { id: 24, type: 4, title: 'COUNT函数', question: 'COUNT(*)和COUNT(列名)的结果一定相同。', options: [{ label: 'A', text: '正确', isCorrect: false }, { label: 'B', text: '错误', isCorrect: true }], explanation: 'COUNT(*)统计所有行包括NULL，COUNT(列名)会忽略该列值为NULL的行，结果可能不同。' },
            { id: 25, type: 4, title: 'LEFT JOIN', question: 'LEFT JOIN返回左表的所有记录，即使右表中没有匹配。', options: [{ label: 'A', text: '正确', isCorrect: true }, { label: 'B', text: '错误', isCorrect: false }], explanation: 'LEFT JOIN保留左表所有记录，右表无匹配时对应列填充NULL。RIGHT JOIN则相反。' },
            { id: 26, type: 4, title: 'NULL比较', question: '在SQL中，可以使用 = NULL 来判断值是否为NULL。', options: [{ label: 'A', text: '正确', isCorrect: false }, { label: 'B', text: '错误', isCorrect: true }], explanation: 'SQL中判断NULL必须使用 IS NULL 或 IS NOT NULL，不能使用 = NULL 或 != NULL。' },
            { id: 27, type: 4, title: '外键约束', question: '外键约束保证子表中的外键值必须在父表的主键中存在。', options: [{ label: 'A', text: '正确', isCorrect: true }, { label: 'B', text: '错误', isCorrect: false }], explanation: '外键约束（FOREIGN KEY）保证参照完整性，子表中外键值必须在父表主键中存在，防止孤行记录。' },
            { id: 28, type: 4, title: 'DISTINCT', question: 'SELECT DISTINCT用于去除查询结果中的重复行。', options: [{ label: 'A', text: '正确', isCorrect: true }, { label: 'B', text: '错误', isCorrect: false }], explanation: 'DISTINCT关键字用于去除查询结果中的重复记录，只保留不重复的行。' },
            { id: 29, type: 4, title: 'HAVING子句', question: 'HAVING子句可以代替WHERE子句做任何条件过滤。', options: [{ label: 'A', text: '正确', isCorrect: false }, { label: 'B', text: '错误', isCorrect: true }], explanation: 'WHERE用于分组前过滤原始数据，HAVING用于分组后过滤聚合结果，两者用途不同不可完全替代。' },
            { id: 30, type: 4, title: '数据库规范化', question: '数据库规范化的目的是消除数据冗余并避免数据异常。', options: [{ label: 'A', text: '正确', isCorrect: true }, { label: 'B', text: '错误', isCorrect: false }], explanation: '规范化通过将大表拆分为小表并建立关系，消除数据冗余，避免插入、更新、删除异常。' }
        ];

        let currentIndex=0,userAnswers=new Array(questions.length).fill(null),correctCount=0,wrongCount=0,isSubmitted=false,questionAnswered=new Array(questions.length).fill(false);

        function init(){renderQuestion();updateAnswerCards();updateStatus();}

        function renderQuestion(){
            const q=questions[currentIndex],container=document.getElementById('questionContainer'),typeLabel=document.getElementById('questionType');
            const answered = questionAnswered[currentIndex];

            if (q.type === 1) {
                typeLabel.textContent = '单选题';
                typeLabel.className = 'bg-purple-100 text-purple-600 px-3 py-1 rounded-full text-sm font-semibold';
            } else if (q.type === 2) {
                typeLabel.textContent = '多选题';
                typeLabel.className = 'bg-pink-100 text-pink-600 px-3 py-1 rounded-full text-sm font-semibold';
            } else if (q.type === 3) {
                typeLabel.textContent = '代码填空题';
                typeLabel.className = 'bg-blue-100 text-blue-600 px-3 py-1 rounded-full text-sm font-semibold';
            } else if (q.type === 4) {
                typeLabel.textContent = '判断题';
                typeLabel.className = 'bg-orange-100 text-orange-600 px-3 py-1 rounded-full text-sm font-semibold';
            }

            let optionsHtml='';
            let explanationHtml = '';

            if (q.type === 1 || q.type === 2) {
                q.options.forEach((opt,index)=>{
                    const isSelected=userAnswers[currentIndex]!==null&&(q.type===1?userAnswers[currentIndex]===index:userAnswers[currentIndex].includes(index));
                    let optionClass='option-btn w-full text-left p-4 border-2 border-gray-200 rounded-xl mb-3';
                    if(isSelected)optionClass+=' selected';
                    if((answered || isSubmitted)&&opt.isCorrect)optionClass+=' correct';
                    if((answered || isSubmitted)&&isSelected&&!opt.isCorrect)optionClass+=' wrong';
                    if(answered || isSubmitted)optionClass+=' disabled';
                    const checkbox=q.type===2?`<span class="inline-block w-5 h-5 border-2 border-gray-300 rounded mr-3 ${isSelected?'bg-purple-500 border-purple-500':''}"></span>`:'';
                    optionsHtml+=`<div class="${optionClass}" onclick="selectOption(${index})"><span class="font-semibold mr-3">${opt.label}.</span>${checkbox}${opt.text}</div>`;
                });
                if (answered || isSubmitted) {
                    explanationHtml = `<div class="mt-6 p-4 bg-purple-50 rounded-xl border-l-4 border-purple-500"><p class="text-gray-700"><strong class="text-purple-600"><i class="fa fa-lightbulb-o mr-1"></i>解析：</strong>${q.explanation}</p></div>`;
                }
                const favoriteBtn = `<button onclick="toggleFavorite(${currentIndex})" class="mt-4 float-right text-xl ${isFavorite(currentIndex) ? 'text-yellow-500' : 'text-gray-300'} hover:text-yellow-500 transition-colors" title="收藏本题"><i class="fa fa-star"></i></button>`;
                container.innerHTML=`<h2 class="text-2xl font-semibold mb-6 text-gray-800"><span class="text-purple-600">${q.id}.</span> ${q.title}${favoriteBtn}</h2><div class="mb-6"><p class="text-gray-700 text-lg">${q.question}</p>${q.type===2?'<p class="text-sm text-gray-500 mt-2">（多选题，至少选择一个答案）</p>':''}</div><div class="space-y-2">${optionsHtml}</div>${explanationHtml}`;
            }
            // 判断题渲染 (type 4)
            else if (q.type === 4) {
                q.options.forEach((opt, index) => {
                    const isSelected = userAnswers[currentIndex] !== null && userAnswers[currentIndex] === index;
                    let optionClass = 'option-btn w-full text-left p-4 border-2 border-gray-200 rounded-xl mb-3';
                    if (isSelected) optionClass += ' selected';
                    if ((answered || isSubmitted) && opt.isCorrect) optionClass += ' correct';
                    if ((answered || isSubmitted) && isSelected && !opt.isCorrect) optionClass += ' wrong';
                    if (answered || isSubmitted) optionClass += ' disabled';
                    optionsHtml += `<div class="${optionClass}" onclick="selectOption(${index})"><span class="font-semibold mr-3">${opt.label}.</span>${opt.text}</div>`;
                });
                if (answered || isSubmitted) {
                    explanationHtml = `<div class="mt-6 p-4 bg-purple-50 rounded-xl border-l-4 border-purple-500"><p class="text-gray-700"><strong class="text-purple-600"><i class="fa fa-lightbulb-o mr-1"></i>解析：</strong>${q.explanation}</p></div>`;
                }
                const favoriteBtn = `<button onclick="toggleFavorite(${currentIndex})" class="mt-4 float-right text-xl ${isFavorite(currentIndex) ? 'text-yellow-500' : 'text-gray-300'} hover:text-yellow-500 transition-colors" title="收藏本题"><i class="fa fa-star"></i></button>`;
                container.innerHTML = `<h2 class="text-2xl font-semibold mb-6 text-gray-800"><span class="text-orange-600">${q.id}.</span> ${q.title}${favoriteBtn}</h2><div class="mb-6"><p class="text-gray-700 text-lg">${q.question}</p></div><div class="space-y-2">${optionsHtml}</div>${explanationHtml}`;
            }
            else if (q.type === 3) {
                const userAnswer = userAnswers[currentIndex] || '';
                const correctAnswer = q.blanks[0];
                let displayCode;
                if (answered || isSubmitted) {
                    displayCode = q.code.replace('___', `<span class="bg-green-200 text-green-800 px-2 py-1 rounded">${correctAnswer}</span>`);
                    explanationHtml = `<div class="mt-4 p-4 bg-purple-50 rounded-xl border-l-4 border-purple-500"><p class="text-gray-700"><strong class="text-purple-600"><i class="fa fa-lightbulb-o mr-1"></i>解析：</strong>${q.explanation}</p></div>`;
                } else {
                    displayCode = q.code.replace('___', `<span class="bg-yellow-100 text-yellow-800 border-b-2 border-yellow-400 px-2 py-1">${userAnswer || '____'}</span>`);
                }
                const favoriteBtn = `<button onclick="toggleFavorite(${currentIndex})" class="absolute top-6 right-6 text-xl ${isFavorite(currentIndex) ? 'text-yellow-500' : 'text-gray-300'} hover:text-yellow-500 transition-colors" title="收藏本题"><i class="fa fa-star"></i></button>`;
                container.innerHTML = `
                    <h2 class="text-2xl font-semibold mb-6 text-gray-800 relative"><span class="text-blue-600">${q.id}.</span> ${q.title}${favoriteBtn}</h2>
                    <div class="mb-6">
                        <p class="text-gray-700 text-lg mb-4">请在代码的空白处填入正确的内容：</p>
                        <div class="bg-gray-900 text-green-400 p-6 rounded-xl font-mono text-sm leading-relaxed overflow-x-auto">
                            <pre>${displayCode}</pre>
                        </div>
                    </div>
                    <div class="mb-6">
                        <input type="text" id="fill-blank-input" class="w-full p-4 border-2 border-blue-300 rounded-xl focus:border-blue-500 focus:outline-none text-lg" placeholder="请输入你的答案..." value="${userAnswer}" ${answered || isSubmitted ? 'disabled' : ''} oninput="handleFillBlankInput(this.value)" onkeydown="if(event.key==='Enter')submitFillBlankAnswer()" />
                        ${!(answered || isSubmitted) ? '<button onclick="submitFillBlankAnswer()" class="mt-3 bg-gradient-to-r from-blue-400 to-purple-500 text-white px-6 py-3 rounded-xl shadow-md hover:from-blue-500 hover:to-purple-600 transition-all w-full"><i class="fa fa-check mr-2"></i>提交答案</button>' : ''}
                        ${explanationHtml}
                    </div>`;
                if (!(answered || isSubmitted)) {
                    document.getElementById('fill-blank-input').focus();
                }
            }

            document.getElementById('prevBtn').disabled=currentIndex===0;
            if(currentIndex===questions.length-1&&userAnswers.every(a=>a!==null&&a!=='')){document.getElementById('nextBtn').classList.add('hidden');document.getElementById('submitAllBtn').classList.remove('hidden');}
            else{document.getElementById('nextBtn').classList.remove('hidden');document.getElementById('submitAllBtn').classList.add('hidden');}
        }
        
        function handleFillBlankInput(value) {
            userAnswers[currentIndex] = value;
            renderQuestion();
            updateAnswerCards();
            updateStatus();
        }

        function submitFillBlankAnswer() { if (isSubmitted || questionAnswered[currentIndex]) return; if (!userAnswers[currentIndex] || !userAnswers[currentIndex].trim()) return; questionAnswered[currentIndex] = true; renderQuestion(); updateAnswerCards(); updateStatus(); }

        function selectOption(index){
            if(isSubmitted || questionAnswered[currentIndex])return;
            const q=questions[currentIndex];
            if(q.type===1)userAnswers[currentIndex]=index;
            else{
                if(userAnswers[currentIndex]===null)userAnswers[currentIndex]=[];
                const idx=userAnswers[currentIndex].indexOf(index);
                if(idx>-1)userAnswers[currentIndex].splice(idx,1);
                else userAnswers[currentIndex].push(index);
                userAnswers[currentIndex].sort((a,b)=>a-b);
            }
            questionAnswered[currentIndex] = true;
            renderQuestion();updateAnswerCards();updateStatus();
        }

        function prevQuestion(){if(currentIndex>0){currentIndex--;renderQuestion();updateAnswerCards();}}
        function nextQuestion(){if(currentIndex<questions.length-1){currentIndex++;renderQuestion();updateAnswerCards();}}
        function goToQuestion(index){currentIndex=index;renderQuestion();updateAnswerCards();}

        function updateAnswerCards(){
            const container=document.getElementById('answerCards');container.innerHTML='';
            questions.forEach((q,index)=>{
                let cardClass='w-10 h-10 rounded-xl flex items-center justify-center font-semibold cursor-pointer transition-all';
                if(userAnswers[index]!==null){const isCorrect=isAnswerCorrect(index);cardClass+=isCorrect?' bg-green-500 text-white':' bg-red-500 text-white';}
                else cardClass+=' bg-gray-200 text-gray-600 hover:bg-gray-300';
                if(index===currentIndex)cardClass+=' ring-2 ring-purple-500';
                container.innerHTML+=`<div class="${cardClass}" onclick="goToQuestion(${index})" title="第${index+1}题">${index+1}</div>`;
            });
        }

        function updateStatus(){
            correctCount=0;wrongCount=0;
            userAnswers.forEach((answer,index)=>{if(answer!==null&&answer!==''){if(isAnswerCorrect(index))correctCount++;else wrongCount++;}});
            document.getElementById('currentQuestionNum').textContent=currentIndex+1;
            document.getElementById('totalQuestionsNum').textContent=questions.length;
            document.getElementById('correctCount').textContent=correctCount;
            document.getElementById('wrongCount').textContent=wrongCount;
            document.getElementById('unansweredCount').textContent=questions.length-userAnswers.filter(a=>a!==null&&a!=='').length;
            document.getElementById('progressBar').style.width=`${(userAnswers.filter(a=>a!==null&&a!=='').length/questions.length)*100}%`;
        }

        function isAnswerCorrect(questionIndex){
            const q=questions[questionIndex],userAnswer=userAnswers[questionIndex];
            if(q.type===1)return q.options[userAnswer].isCorrect;
            else if(q.type===2){const correctIndices=q.options.reduce((acc,opt,idx)=>{if(opt.isCorrect)acc.push(idx);return acc;},[]);if(userAnswer.length!==correctIndices.length)return false;return userAnswer.every(idx=>correctIndices.includes(idx));}
            else if(q.type===3){return q.blanks.some(blank=>userAnswer.trim().toLowerCase()===String(blank).toLowerCase());}
            else if(q.type===4){return q.options[userAnswer].isCorrect;}
        }

        function submitAll(){isSubmitted=true;showResults();}

        function showResults(){ 
            const wrongQuestions = [];
            const allQuestionsAnalysis = [];
            
            // 遍历所有题目
            userAnswers.forEach((answer, index) => {
                const q = questions[index];
                const isCorrect = isAnswerCorrect(index);
                let userAnswerText, correctAnswerText;
                
                // 选择题答案处理
                if (q.type === 1) {
                    userAnswerText = q.options[answer] ? q.options[answer].text : '未作答';
                    correctAnswerText = q.options.filter(o => o.isCorrect).map(o => o.text).join('、');
                } else if (q.type === 2) {
                    userAnswerText = answer && answer.length > 0 ? answer.map(i => q.options[i].text).join('、') : '未作答';
                    correctAnswerText = q.options.filter(o => o.isCorrect).map(o => o.text).join('、');
                } else if (q.type === 3) {
                    userAnswerText = answer || '未作答';
                    correctAnswerText = q.blanks.join(' 或 ');
                } else if (q.type === 4) {
                    userAnswerText = q.options[answer] ? q.options[answer].text : '未作答';
                    correctAnswerText = q.options.filter(o => o.isCorrect).map(o => o.text).join('、');
                }
                
                // 收集错题
                if (answer !== null && answer !== '' && !isCorrect) {
                    wrongQuestions.push({
                        questionId: q.id,
                        question: q.type === 3 ? q.code : q.question,
                        userAnswer: userAnswerText,
                        correctAnswer: correctAnswerText,
                        explanation: q.explanation,
                        type: q.type
                    });
                }
                
                // 收集所有题目的解析
                allQuestionsAnalysis.push({
                    index: index,
                    id: q.id,
                    title: q.title,
                    type: q.type,
                    question: q.type === 3 ? q.code : q.question,
                    userAnswer: userAnswerText,
                    correctAnswer: correctAnswerText,
                    explanation: q.explanation,
                    isCorrect: isCorrect && answer !== null && answer !== ''
                });
            });
            
            StorageManager.saveQuizResult(COURSE_ID, { score: correctCount, total: questions.length, wrongQuestions: wrongQuestions });
            
            // 显示结果统计
            document.getElementById('resultSection').classList.remove('hidden'); 
            document.querySelector('section.py-12').classList.add('hidden'); 
            const score = correctCount; 
            const total = questions.length; 
            const rate = Math.round((score / total) * 100); 
            document.getElementById('finalScore').textContent = `${score}/${total}`; 
            document.getElementById('finalCorrect').textContent = correctCount; 
            document.getElementById('finalWrong').textContent = wrongCount; 
            document.getElementById('finalRate').textContent = `${rate}%`; 
            let grade = ''; let message = ''; let icon = ''; 
            if (rate >= 90) { grade = '优秀'; message = '太棒了！你对数据库原理与应用掌握得非常扎实！'; icon = '🏆'; } 
            else if (rate >= 80) { grade = '良好'; message = '非常出色！继续保持！'; icon = '🎉'; } 
            else if (rate >= 70) { grade = '中等'; message = '不错！还有一些细节需要加强。'; icon = '👍'; } 
            else if (rate >= 60) { grade = '及格'; message = '刚好及格，建议复习一下。'; icon = '💪'; } 
            else { grade = '需努力'; message = '加油！多做练习，你会进步的！'; icon = '📚'; } 
            document.getElementById('resultIcon').textContent = icon; 
            document.getElementById('finalGrade').textContent = grade; 
            document.getElementById('finalGrade').className = `font-bold text-2xl ${rate >= 90 ? 'text-green-600' : rate >= 70 ? 'text-blue-600' : rate >= 60 ? 'text-yellow-600' : 'text-red-600'}`; 
            document.getElementById('gradeMessage').textContent = message; 
            
            // 显示所有题目解析（无论对错都显示）
            const allAnalysisContainer = document.getElementById('allQuestionsAnalysis') || createAllAnalysisSection();
            const allAnalysisList = document.getElementById('allAnalysisList');
            allAnalysisList.innerHTML = '';
            
            allQuestionsAnalysis.forEach(item => {
                const isCorrect = item.isCorrect;
                const isFillBlank = item.type === 3;
                const bgColor = isCorrect ? 'bg-green-50' : 'bg-red-50';
                const borderColor = isCorrect ? 'border-green-500' : 'border-red-500';
                const iconSymbol = isCorrect ? '✓' : '✗';
                const iconColor = isCorrect ? 'text-green-500' : 'text-red-500';
                
                let html = `
                    <div class="${bgColor} rounded-xl p-5 border-l-4 ${borderColor} mb-4">
                        <div class="flex items-center justify-between mb-3">
                            <div class="flex items-center">
                                <span class="${iconColor} text-2xl font-bold mr-3">${iconSymbol}</span>
                                <span class="font-semibold text-gray-800">第 ${item.index + 1} 题</span>
                                ${isFillBlank ? '<span class="ml-2 bg-blue-100 text-blue-600 px-2 py-1 rounded text-xs">代码填空</span>' : ''}
                            </div>
                            <span class="text-sm font-medium ${isCorrect ? 'text-green-600' : 'text-red-600'}">${isCorrect ? '正确' : '错误'}</span>
                        </div>
                        <div class="font-semibold text-gray-800 mb-2">${item.title}</div>
                        <div class="mb-3 ${isFillBlank ? '' : 'text-gray-700'}">${isFillBlank ? `<pre class="bg-gray-900 text-green-400 p-3 rounded text-sm overflow-x-auto">${item.question}</pre>` : item.question}</div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-sm mb-3">
                            <div>
                                <span class="text-red-600"><strong>你的答案：</strong></span>
                                <span class="text-gray-700">${item.userAnswer}</span>
                            </div>
                            <div>
                                <span class="text-green-600"><strong>正确答案：</strong></span>
                                <span class="text-gray-700">${item.correctAnswer}</span>
                            </div>
                        </div>
                        <div class="bg-white/70 p-3 rounded-lg border border-gray-200">
                            <p class="text-purple-700 text-sm"><i class="fa fa-lightbulb-o mr-1"></i><strong>解析：</strong>${item.explanation}</p>
                        </div>
                    </div>`;
                allAnalysisList.innerHTML += html;
            });
            
            document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth' }); 
        }
        
        function createAllAnalysisSection() {
            const container = document.getElementById('resultSection');
            const section = document.createElement('div');
            section.id = 'allQuestionsAnalysis';
            section.className = 'container mx-auto px-4 py-12';
            section.innerHTML = `
                <div class="max-w-4xl mx-auto">
                    <h2 class="text-2xl font-bold mb-6 text-purple-700 text-center">
                        <i class="fa fa-list-alt mr-2"></i>所有题目解析
                    </h2>
                    <div id="allAnalysisList"></div>
                </div>
            `;
            container.appendChild(section);
            return section;
        }

        function restartQuiz(){currentIndex=0;userAnswers=new Array(questions.length).fill(null);correctCount=0;wrongCount=0;isSubmitted=false;questionAnswered=new Array(questions.length).fill(false);document.getElementById('resultSection').classList.add('hidden');document.querySelector('section.py-12').classList.remove('hidden');document.getElementById('progressBar').style.width='0%';init();}
        function toggleMobileMenu(){document.getElementById('mobileMenu').classList.toggle('hidden');}
        
        // 收藏功能
        function getFavorites() {
            return JSON.parse(localStorage.getItem('favorites_' + COURSE_ID) || '[]');
        }
        
        function saveFavorites(favorites) {
            localStorage.setItem('favorites_' + COURSE_ID, JSON.stringify(favorites));
        }
        
        function isFavorite(questionIndex) {
            return getFavorites().includes(questionIndex);
        }
        
        function toggleFavorite(questionIndex) {
            let favorites = getFavorites();
            const idx = favorites.indexOf(questionIndex);
            if (idx > -1) {
                favorites.splice(idx, 1);
            } else {
                favorites.push(questionIndex);
            }
            saveFavorites(favorites);
            renderQuestion();
        }
        
        // 键盘快捷键
        document.addEventListener('keydown', function(e) {
            if (isSubmitted) return;
            const q = questions[currentIndex];
            
            // 1-4选择选项
            if (e.key >= '1' && e.key <= '4') {
                const optionIndex = parseInt(e.key) - 1;
                if (q && (q.type === 1 || q.type === 4) && !questionAnswered[currentIndex]) {
                    selectOption(optionIndex);
                }
            }
            
            // Enter提交填空题
            if (e.key === 'Enter' && q.type === 3 && !questionAnswered[currentIndex]) {
                submitFillBlankAnswer();
            }
            
            // 左右箭头切换题目
            if (e.key === 'ArrowLeft') {
                prevQuestion();
            }
            if (e.key === 'ArrowRight') {
                nextQuestion();
            }
            
            // Escape标记当前题（类似收藏）
            if (e.key === 'Escape') {
                toggleFavorite(currentIndex);
            }
        });
        
        init();
    </script>
</body>
</html>
