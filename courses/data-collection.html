<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据采集与处理练习 - 袁佳琪的个人页面</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans SC', sans-serif;
        }
        
        .option-btn {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .option-btn:hover:not(.selected):not(.disabled) {
            transform: translateX(5px);
            border-color: #a855f7;
            background-color: #f3e8ff;
        }
        
        .option-btn.selected {
            border-color: #a855f7;
            background-color: #f3e8ff;
        }
        
        .option-btn.correct {
            border-color: #22c55e !important;
            background-color: #dcfce7 !important;
        }
        
        .option-btn.wrong {
            border-color: #ef4444 !important;
            background-color: #fee2e2 !important;
        }
        
        .option-btn.disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-pink-50 via-purple-50 to-blue-50">
    <nav class="bg-white/80 backdrop-blur-md shadow-md">
        <div class="container mx-auto px-4 py-3">
            <div class="flex justify-between items-center">

                <a href="../index.html#courses" class="block text-gray-700 hover:text-purple-500">课程</a>

    <header class="bg-gradient-to-r from-pink-400 via-purple-400 to-blue-400 text-white py-12">
        <div class="container mx-auto px-4 text-center">
            <h1 class="text-3xl md:text-4xl font-bold mb-4">数据采集与处理</h1>
            <p class="text-lg md:text-xl">课程练习题</p>
        </div>
    </header>

    <section class="py-8 bg-white border-b border-purple-100">
        <div class="container mx-auto px-4">
            <div class="max-w-3xl mx-auto">
                <h2 class="text-2xl font-bold mb-4 text-purple-700">课程简介</h2>
                <p class="text-gray-600 mb-4">
                    数据采集与处理课程主要学习数据采集、清洗和预处理技术，包括网络爬虫、API调用、数据清洗、数据转换等。学生将掌握使用Python进行各种数据采集任务的能力。
                </p>
            </div>
        </div>
    </section>

    <div class="bg-purple-200 h-2">
        <div id="progressBar" class="bg-gradient-to-r from-pink-400 to-purple-500 h-2 transition-all duration-500" style="width: 0%"></div>
    </div>

    <section class="py-12">
        <div class="container mx-auto px-4">
            <div class="max-w-3xl mx-auto">
                <div id="statusBar" class="bg-white rounded-2xl shadow-lg p-6 mb-8 border border-blue-100">
                    <div class="flex justify-between items-center mb-4">
                        <div class="text-lg">
                            <span class="font-semibold text-gray-800">第 <span id="currentQuestionNum" class="text-purple-600">1</span> 题</span>
                            <span class="text-gray-500">/ 共 <span id="totalQuestionsNum">10</span> 题</span>
                        </div>
                        <div id="questionType" class="bg-purple-100 text-purple-600 px-3 py-1 rounded-full text-sm font-semibold">
                            单选题
                        </div>
                    </div>
                    <div class="flex items-center justify-between">
                        <div class="text-gray-600">
                            <i class="fa fa-check-circle text-green-500 mr-1"></i>
                            正确: <span id="correctCount" class="font-semibold text-green-600">0</span>
                        </div>
                        <div class="text-gray-600">
                            <i class="fa fa-times-circle text-red-500 mr-1"></i>
                            错误: <span id="wrongCount" class="font-semibold text-red-600">0</span>
                        </div>
                        <div class="text-gray-600">
                            <i class="fa fa-clock-o text-blue-500 mr-1"></i>
                            未答: <span id="unansweredCount" class="font-semibold text-gray-600">10</span>
                        </div>
                    </div>
                </div>

                <div id="questionContainer" class="bg-white rounded-2xl shadow-lg p-8 mb-8 border border-purple-100">
                </div>

                <div class="flex flex-wrap justify-between gap-4">
                    <button id="prevBtn" onclick="prevQuestion()" class="bg-gray-400 text-white px-6 py-3 rounded-xl hover:bg-gray-500 transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center">
                        <i class="fa fa-arrow-left mr-2"></i>上一题
                    </button>
                    
                    <button id="submitAllBtn" onclick="submitAll()" class="bg-gradient-to-r from-green-400 to-emerald-500 text-white px-6 py-3 rounded-xl hover:from-green-500 hover:to-emerald-600 transition-colors hidden flex items-center shadow-md">
                        <i class="fa fa-paper-plane mr-2"></i>提交全部
                    </button>
                    
                    <button id="nextBtn" onclick="nextQuestion()" class="bg-gradient-to-r from-pink-400 to-purple-500 text-white px-6 py-3 rounded-xl hover:from-pink-500 hover:to-purple-600 transition-colors flex items-center shadow-md">
                        下一题<i class="fa fa-arrow-right ml-2"></i>
                    </button>
                </div>

                <div id="answerSheet" class="mt-8 bg-white rounded-2xl shadow-lg p-6 border border-blue-100">
                    <h3 class="text-lg font-semibold mb-4 text-purple-700">
                        <i class="fa fa-list-ul mr-2"></i>答题卡
                    </h3>
                    <div id="answerCards" class="flex flex-wrap gap-3">
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section id="resultSection" class="py-12 hidden">
        <div class="container mx-auto px-4">
            <div class="max-w-3xl mx-auto">
                <div class="bg-white rounded-2xl shadow-lg p-8 text-center border border-purple-100">
                    <div id="resultIcon" class="text-7xl mb-6"></div>
                    <h2 class="text-3xl font-bold mb-4 text-purple-700">练习完成！</h2>
                    
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                        <div class="bg-pink-50 rounded-xl p-4 border border-pink-100">
                            <div class="text-3xl font-bold text-pink-600" id="finalScore">0</div>
                            <div class="text-gray-600">得分</div>
                        </div>
                        <div class="bg-green-50 rounded-xl p-4 border border-green-100">
                            <div class="text-3xl font-bold text-green-600" id="finalCorrect">0</div>
                            <div class="text-gray-600">正确</div>
                        </div>
                        <div class="bg-red-50 rounded-xl p-4 border border-red-100">
                            <div class="text-3xl font-bold text-red-600" id="finalWrong">0</div>
                            <div class="text-gray-600">错误</div>
                        </div>
                        <div class="bg-purple-50 rounded-xl p-4 border border-purple-100">
                            <div class="text-3xl font-bold text-purple-600" id="finalRate">0%</div>
                            <div class="text-gray-600">正确率</div>
                        </div>
                    </div>

                    <div id="gradeSection" class="mb-8">

                    </div>

                    <div id="wrongQuestions" class="mt-8 text-left hidden">
                        <h3 class="text-xl font-bold mb-4 text-red-600">
                            <i class="fa fa-exclamation-triangle mr-2"></i>错题汇总
                        </h3>
                        <div id="wrongQuestionsList" class="space-y-4">
                        </div>
                    </div>

                    <div class="flex flex-wrap justify-center gap-4 mt-8">
                        <button onclick="restartQuiz()" class="bg-gradient-to-r from-purple-500 to-pink-500 text-white px-8 py-3 rounded-xl hover:from-purple-600 hover:to-pink-600 transition-colors shadow-md">
                            <i class="fa fa-refresh mr-2"></i>重新练习
                        </button>
                        <a href="../index.html" class="bg-gray-200 text-gray-700 px-8 py-3 rounded-xl hover:bg-gray-300 transition-colors inline-block">
                            <i class="fa fa-home mr-2"></i>返回首页
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="bg-gradient-to-r from-purple-500 to-pink-500 text-white py-8 mt-12">
        <div class="container mx-auto px-4 text-center">
            <p>&copy; 2026 袁佳琪的个人页面</p>
        </div>
    </footer>

    <script>
        const COURSE_ID = 'data-collection';
                const questions = [
            { id: 1, type: 1, title: 'HTTP协议', question: 'HTTP协议中，用于获取资源的请求方法是？', options: [{ label: 'A', text: 'POST', isCorrect: false }, { label: 'B', text: 'GET', isCorrect: true }, { label: 'C', text: 'PUT', isCorrect: false }, { label: 'D', text: 'DELETE', isCorrect: false }], explanation: 'GET是HTTP中用于获取服务器资源的请求方法，是最常用的请求方法。' },
            { id: 2, type: 1, title: 'requests库', question: '使用requests库发送HTTP GET请求应该调用哪个函数？', options: [{ label: 'A', text: 'requests.get()', isCorrect: true }, { label: 'B', text: 'requests.fetch()', isCorrect: false }, { label: 'C', text: 'requests.request()', isCorrect: false }, { label: 'D', text: 'requests.send()', isCorrect: false }], explanation: 'requests.get()用于发送GET请求，requests.post()发送POST请求。' },
            { id: 3, type: 1, title: '响应状态码', question: 'HTTP状态码200表示什么？', options: [{ label: 'A', text: '请求成功', isCorrect: true }, { label: 'B', text: '重定向', isCorrect: false }, { label: 'C', text: '客户端错误', isCorrect: false }, { label: 'D', text: '服务器错误', isCorrect: false }], explanation: 'HTTP 200表示请求成功，3xx表示重定向，4xx表示客户端错误，5xx表示服务器错误。' },
            { id: 4, type: 1, title: 'HTML解析', question: '以下哪个库常用于解析HTML网页？', options: [{ label: 'A', text: 'BeautifulSoup', isCorrect: true }, { label: 'B', text: 'numpy', isCorrect: false }, { label: 'C', text: 'pandas', isCorrect: false }, { label: 'D', text: 'matplotlib', isCorrect: false }], explanation: 'BeautifulSoup是Python中专门用于解析HTML和XML文档的库。' },
            { id: 5, type: 1, title: '请求头设置', question: '设置User-Agent的主要目的是什么？', options: [{ label: 'A', text: '提高爬取速度', isCorrect: false }, { label: 'B', text: '模拟浏览器访问', isCorrect: true }, { label: 'C', text: '加密数据传输', isCorrect: false }, { label: 'D', text: '压缩响应数据', isCorrect: false }], explanation: 'User-Agent标识请求的客户端类型，设置它可以模拟浏览器访问，避免被识别为爬虫而封禁。' },
            { id: 6, type: 1, title: 'JSON解析', question: '在Python中，解析JSON字符串应该使用哪个函数？', options: [{ label: 'A', text: 'json.loads()', isCorrect: true }, { label: 'B', text: 'json.dumps()', isCorrect: false }, { label: 'C', text: 'json.parse()', isCorrect: false }, { label: 'D', text: 'json.read()', isCorrect: false }], explanation: 'json.loads()用于解析JSON字符串为Python对象，json.dumps()则相反。' },
            { id: 7, type: 1, title: '反爬虫应对', question: '以下哪种方式可以有效应对IP封禁？', options: [{ label: 'A', text: '加快请求频率', isCorrect: false }, { label: 'B', text: '使用代理IP轮换', isCorrect: true }, { label: 'C', text: '不设置请求头', isCorrect: false }, { label: 'D', text: '减少睡眠时间', isCorrect: false }], explanation: '使用代理IP轮换可以分散请求来源IP，有效应对基于IP的反爬虫策略。' },
            { id: 8, type: 1, title: '正则表达式', question: '正则表达式中，用于匹配任意单个字符的符号是？', options: [{ label: 'A', text: '*', isCorrect: false }, { label: 'B', text: '.', isCorrect: true }, { label: 'C', text: '+', isCorrect: false }, { label: 'D', text: '?', isCorrect: false }], explanation: '.在正则表达式中匹配任意单个字符（除换行符外），*匹配0次或多次，+匹配1次或多次。' },
            { id: 9, type: 1, title: 'Session对象', question: 'requests库中Session对象的主要作用是什么？', options: [{ label: 'A', text: '加密请求数据', isCorrect: false }, { label: 'B', text: '保持请求之间的cookies', isCorrect: true }, { label: 'C', text: '异步请求', isCorrect: false }, { label: 'D', text: '数据压缩', isCorrect: false }], explanation: 'Session对象可以在多个请求之间保持cookies、headers等参数，常用于需要登录的场景。' },
            { id: 10, type: 1, title: 'CSS选择器', question: '以下哪个CSS选择器可以选取所有class为"item"的元素？', options: [{ label: 'A', text: '#item', isCorrect: false }, { label: 'B', text: '.item', isCorrect: true }, { label: 'C', text: 'item', isCorrect: false }, { label: 'D', text: '*item', isCorrect: false }], explanation: 'CSS中，点号(.)用于选取class，井号(#)用于选取id，标签名直接写选取对应标签。' },
            { id: 11, type: 2, title: '爬虫方法（多选）', question: '以下哪些是Python中常用的网页爬取库或工具？（多选）', options: [{ label: 'A', text: 'requests', isCorrect: true }, { label: 'B', text: 'BeautifulSoup', isCorrect: true }, { label: 'C', text: 'Scrapy', isCorrect: true }, { label: 'D', text: 'Flask', isCorrect: false }], explanation: 'requests、BeautifulSoup、Scrapy都是常用的爬虫库或框架，Flask是Web开发框架。' },
            { id: 12, type: 2, title: '数据解析方式（多选）', question: '以下哪些是常用的数据解析方式？（多选）', options: [{ label: 'A', text: '正则表达式', isCorrect: true }, { label: 'B', text: 'XPath', isCorrect: true }, { label: 'C', text: 'CSS选择器', isCorrect: true }, { label: 'D', text: 'JSON解析', isCorrect: true }], explanation: '正则表达式、XPath、CSS选择器用于解析HTML/XML，JSON解析用于处理API返回的JSON数据。' },
            { id: 13, type: 2, title: '反爬虫（多选）', question: '常见的反爬虫机制包括？（多选）', options: [{ label: 'A', text: 'IP频率限制', isCorrect: true }, { label: 'B', text: '验证码', isCorrect: true }, { label: 'C', text: 'User-Agent检测', isCorrect: true }, { label: 'D', text: 'JavaScript渲染', isCorrect: true }], explanation: 'IP限制、验证码、User-Agent检测、JS渲染都是常见的反爬虫技术手段。' },
            { id: 14, type: 2, title: 'HTTP请求（多选）', question: 'HTTP协议中常用的请求方法包括？（多选）', options: [{ label: 'A', text: 'GET', isCorrect: true }, { label: 'B', text: 'POST', isCorrect: true }, { label: 'C', text: 'PUT', isCorrect: true }, { label: 'D', text: 'DELETE', isCorrect: true }], explanation: 'GET、POST、PUT、DELETE都是HTTP协议中常用的请求方法，分别对应获取、创建、更新、删除操作。' },
            { id: 15, type: 2, title: '数据采集注意事项（多选）', question: '进行数据采集时需要注意哪些问题？（多选）', options: [{ label: 'A', text: '遵守robots.txt', isCorrect: true }, { label: 'B', text: '控制请求频率', isCorrect: true }, { label: 'C', text: '不爬取隐私数据', isCorrect: true }, { label: 'D', text: '可以任意爬取任何数据', isCorrect: false }], explanation: '数据采集需要遵守法律法规，控制频率、遵守robots.txt、不爬取隐私数据是基本准则。' },
            { id: 16, type: 3, title: 'requests请求（代码补全）', code: 'import requests\nresponse = requests.___("https://api.example.com/data")\nprint(response.status_code)', blanks: ['get'], explanation: '使用requests.get()方法发送GET请求，获取服务器响应。status_code属性表示HTTP状态码。' },
            { id: 17, type: 3, title: 'BeautifulSoup解析（代码补全）', code: 'from bs4 import BeautifulSoup\nhtml = "<html><body><h1>标题</h1></body></html>"\nsoup = BeautifulSoup(html, "___")\nprint(soup.h1.text)', blanks: ['html.parser'], explanation: 'BeautifulSoup的第二个参数指定解析器，"html.parser"是Python内置的HTML解析器。' },
            { id: 18, type: 3, title: 'JSON解析（代码补全）', code: 'import json\ndata = '{"name": "Alice", "age": 20}\'\nresult = json.___(data)\nprint(result["name"])', blanks: ['loads'], explanation: 'json.loads()用于解析JSON字符串，返回Python字典对象，可以通过键获取值。' },
            { id: 19, type: 3, title: '请求头设置（代码补全）', code: 'import requests\nheaders = {"User-Agent": "Mozilla/5.0"}\nresponse = requests.get(url, ___=headers)\nprint(response.text)', blanks: ['headers'], explanation: 'requests.get()通过headers参数传递请求头字典，用于模拟浏览器访问。' },
            { id: 20, type: 3, title: '正则表达式匹配（代码补全）', code: 'import re\ntext = "邮箱: example@email.com"\npattern = r"\\w+@\\w+\\.\\w+"\nresult = re.___(pattern, text)\nprint(result.group())', blanks: ['search'], explanation: 're.search()在文本中搜索匹配正则表达式的第一个位置，返回Match对象，通过group()获取匹配结果。' },
            { id: 21, type: 4, title: 'robots.txt', question: 'robots.txt文件中的规则对所有爬虫都有强制约束力。', options: [{ label: 'A', text: '正确', isCorrect: false }, { label: 'B', text: '错误', isCorrect: true }], explanation: 'robots.txt只是建议性的协议，技术上可以绕过，但遵守它是网络爬虫的职业道德和良好实践。' },
            { id: 22, type: 4, title: 'IP封禁', question: '高频请求不会导致IP被封禁。', options: [{ label: 'A', text: '正确', isCorrect: false }, { label: 'B', text: '错误', isCorrect: true }], explanation: '高频请求会给服务器造成压力，很容易被识别为恶意爬虫而导致IP被封禁。' },
            { id: 23, type: 4, title: 'BeautifulSoup', question: 'BeautifulSoup可以直接解析动态JavaScript生成的内容。', options: [{ label: 'A', text: '正确', isCorrect: false }, { label: 'B', text: '错误', isCorrect: true }], explanation: 'BeautifulSoup只能解析静态HTML，JS动态生成的内容需要使用Selenium或Pyppeteer等工具。' },
            { id: 24, type: 4, title: 'API限流', question: 'API调用次数限制是强制性的，突破限制可能导致账户被封禁。', options: [{ label: 'A', text: '正确', isCorrect: true }, { label: 'B', text: '错误', isCorrect: false }], explanation: 'API限流是服务端强制执行的，突破限制通常会导致请求被拒绝、账户被封禁或IP被拉黑。' },
            { id: 25, type: 4, title: '数据合法采集', question: '只要能访问到的数据都可以合法采集。', options: [{ label: 'A', text: '正确', isCorrect: false }, { label: 'B', text: '错误', isCorrect: true }], explanation: '数据采集需要遵守法律法规和网站服务条款，不得采集个人隐私数据、版权受保护内容等。' },
            { id: 26, type: 4, title: 'XPath', question: 'XPath可以根据元素的属性值来定位元素。', options: [{ label: 'A', text: '正确', isCorrect: true }, { label: 'B', text: '错误', isCorrect: false }], explanation: 'XPath支持通过@属性名来根据属性值定位元素，例如//div[@class="content"]。' },
            { id: 27, type: 4, title: 'Cookies', question: 'requests.Session()可以自动保持和管理Cookies。', options: [{ label: 'A', text: '正确', isCorrect: true }, { label: 'B', text: '错误', isCorrect: false }], explanation: 'requests的Session对象会自动管理cookies，在多次请求之间保持会话状态，常用于需要登录的场景。' },
            { id: 28, type: 4, title: '异步请求', question: 'requests库原生支持异步HTTP请求。', options: [{ label: 'A', text: '正确', isCorrect: false }, { label: 'B', text: '错误', isCorrect: true }], explanation: 'requests是同步库，原生不支持异步。要做异步请求可以使用aiohttp或httpx等异步HTTP客户端。' },
            { id: 29, type: 4, title: '数据清洗', question: '爬取到的原始数据通常需要清洗后才能使用。', options: [{ label: 'A', text: '正确', isCorrect: true }, { label: 'B', text: '错误', isCorrect: false }], explanation: '爬取的原始数据往往包含HTML标签、空白字符等，需要进行去重、清洗、格式化等处理后才能使用。' },
            { id: 30, type: 4, title: 'POST请求', question: 'POST请求的数据会显示在URL中。', options: [{ label: 'A', text: '正确', isCorrect: false }, { label: 'B', text: '错误', isCorrect: true }], explanation: 'POST请求的数据放在请求体中，不会显示在URL中，GET请求的数据才会作为查询参数附加在URL后。' }
        ];];

        let currentIndex = 0;
        let userAnswers = new Array(questions.length).fill(null);
        let correctCount = 0;
        let wrongCount = 0;
        let isSubmitted = false;
        let questionAnswered = new Array(questions.length).fill(false);

        function init() {
            renderQuestion();
            updateAnswerCards();
            updateStatus();
        }

        function renderQuestion() {
            const q = questions[currentIndex];
            const container = document.getElementById('questionContainer');
            const typeLabel = document.getElementById('questionType');
            const answered = questionAnswered[currentIndex];

            if (q.type === 1) {
                typeLabel.textContent = '单选题';
                typeLabel.className = 'bg-purple-100 text-purple-600 px-3 py-1 rounded-full text-sm font-semibold';
            } else if (q.type === 2) {
                typeLabel.textContent = '多选题';
                typeLabel.className = 'bg-pink-100 text-pink-600 px-3 py-1 rounded-full text-sm font-semibold';
            } else if (q.type === 3) {
                typeLabel.textContent = '代码填空题';
                typeLabel.className = 'bg-blue-100 text-blue-600 px-3 py-1 rounded-full text-sm font-semibold';
            } else if (q.type === 4) {
                typeLabel.textContent = '判断题';
                typeLabel.className = 'bg-orange-100 text-orange-600 px-3 py-1 rounded-full text-sm font-semibold';
            }

            let optionsHtml = '';
            let explanationHtml = '';

            if (q.type === 1 || q.type === 2) {
                q.options.forEach((opt, index) => {
                    const isSelected = userAnswers[currentIndex] !== null &&
                        (q.type === 1 ? userAnswers[currentIndex] === index : userAnswers[currentIndex].includes(index));
                    let optionClass = 'option-btn w-full text-left p-4 border-2 border-gray-200 rounded-xl mb-3';
                    if (isSelected) optionClass += ' selected';
                    if ((answered || isSubmitted) && opt.isCorrect) optionClass += ' correct';
                    if ((answered || isSubmitted) && isSelected && !opt.isCorrect) optionClass += ' wrong';
                    if (answered || isSubmitted) optionClass += ' disabled';
                    const checkbox = q.type === 2 ? `<span class="inline-block w-5 h-5 border-2 border-gray-300 rounded mr-3 ${isSelected ? 'bg-purple-500 border-purple-500' : ''}"></span>` : '';
                    optionsHtml += `<div class="${optionClass}" onclick="selectOption(${index})"><span class="font-semibold mr-3">${opt.label}.</span>${checkbox}${opt.text}</div>`;
                });
                if (answered || isSubmitted) {
                    explanationHtml = `<div class="mt-6 p-4 bg-purple-50 rounded-xl border-l-4 border-purple-500"><p class="text-gray-700"><strong class="text-purple-600"><i class="fa fa-lightbulb-o mr-1"></i>解析：</strong>${q.explanation}</p></div>`;
                }
                const favoriteBtn = `<button onclick="toggleFavorite(${currentIndex})" class="mt-4 float-right text-xl ${isFavorite(currentIndex) ? 'text-yellow-500' : 'text-gray-300'} hover:text-yellow-500 transition-colors" title="收藏本题"><i class="fa fa-star"></i></button>`;
                container.innerHTML = `<h2 class="text-2xl font-semibold mb-6 text-gray-800"><span class="text-purple-600">${q.id}.</span> ${q.title}${favoriteBtn}</h2><div class="mb-6"><p class="text-gray-700 text-lg">${q.question}</p>${q.type === 2 ? '<p class="text-sm text-gray-500 mt-2">（多选题，至少选择一个答案）</p>' : ''}</div><div class="space-y-2">${optionsHtml}</div>${explanationHtml}`;
            }
            // 判断题渲染 (type 4)
            else if (q.type === 4) {
                q.options.forEach((opt, index) => {
                    const isSelected = userAnswers[currentIndex] !== null && userAnswers[currentIndex] === index;
                    let optionClass = 'option-btn w-full text-left p-4 border-2 border-gray-200 rounded-xl mb-3';
                    if (isSelected) optionClass += ' selected';
                    if ((answered || isSubmitted) && opt.isCorrect) optionClass += ' correct';
                    if ((answered || isSubmitted) && isSelected && !opt.isCorrect) optionClass += ' wrong';
                    if (answered || isSubmitted) optionClass += ' disabled';
                    optionsHtml += `<div class="${optionClass}" onclick="selectOption(${index})"><span class="font-semibold mr-3">${opt.label}.</span>${opt.text}</div>`;
                });
                if (answered || isSubmitted) {
                    explanationHtml = `<div class="mt-6 p-4 bg-purple-50 rounded-xl border-l-4 border-purple-500"><p class="text-gray-700"><strong class="text-purple-600"><i class="fa fa-lightbulb-o mr-1"></i>解析：</strong>${q.explanation}</p></div>`;
                }
                const favoriteBtn = `<button onclick="toggleFavorite(${currentIndex})" class="mt-4 float-right text-xl ${isFavorite(currentIndex) ? 'text-yellow-500' : 'text-gray-300'} hover:text-yellow-500 transition-colors" title="收藏本题"><i class="fa fa-star"></i></button>`;
                container.innerHTML = `<h2 class="text-2xl font-semibold mb-6 text-gray-800"><span class="text-orange-600">${q.id}.</span> ${q.title}${favoriteBtn}</h2><div class="mb-6"><p class="text-gray-700 text-lg">${q.question}</p></div><div class="space-y-2">${optionsHtml}</div>${explanationHtml}`;
            }
            else if (q.type === 3) {
                const userAnswer = userAnswers[currentIndex] || '';
                const correctAnswer = q.blanks[0];
                let displayCode;
                if (answered || isSubmitted) {
                    displayCode = q.code.replace('___', `<span class="bg-green-200 text-green-800 px-2 py-1 rounded">${correctAnswer}</span>`);
                    explanationHtml = `<div class="mt-4 p-4 bg-purple-50 rounded-xl border-l-4 border-purple-500"><p class="text-gray-700"><strong class="text-purple-600"><i class="fa fa-lightbulb-o mr-1"></i>解析：</strong>${q.explanation}</p></div>`;
                } else {
                    displayCode = q.code.replace('___', `<span class="bg-yellow-100 text-yellow-800 border-b-2 border-yellow-400 px-2 py-1">${userAnswer || '____'}</span>`);
                }
                const favoriteBtn = `<button onclick="toggleFavorite(${currentIndex})" class="absolute top-6 right-6 text-xl ${isFavorite(currentIndex) ? 'text-yellow-500' : 'text-gray-300'} hover:text-yellow-500 transition-colors" title="收藏本题"><i class="fa fa-star"></i></button>`;
                container.innerHTML = `
                    <h2 class="text-2xl font-semibold mb-6 text-gray-800 relative"><span class="text-blue-600">${q.id}.</span> ${q.title}${favoriteBtn}</h2>
                    <div class="mb-6">
                        <p class="text-gray-700 text-lg mb-4">请在代码的空白处填入正确的内容：</p>
                        <div class="bg-gray-900 text-green-400 p-6 rounded-xl font-mono text-sm leading-relaxed overflow-x-auto">
                            <pre>${displayCode}</pre>
                        </div>
                    </div>
                    <div class="mb-6">
                        <input type="text" id="fill-blank-input" class="w-full p-4 border-2 border-blue-300 rounded-xl focus:border-blue-500 focus:outline-none text-lg" placeholder="请输入你的答案..." value="${userAnswer}" ${answered || isSubmitted ? 'disabled' : ''} oninput="handleFillBlankInput(this.value)" onkeydown="if(event.key==='Enter')submitFillBlankAnswer()" />
                        ${!(answered || isSubmitted) ? '<button onclick="submitFillBlankAnswer()" class="mt-3 bg-gradient-to-r from-blue-400 to-purple-500 text-white px-6 py-3 rounded-xl shadow-md hover:from-blue-500 hover:to-purple-600 transition-all w-full"><i class="fa fa-check mr-2"></i>提交答案</button>' : ''}
                        ${explanationHtml}
                    </div>`;
                if (!(answered || isSubmitted)) {
                    document.getElementById('fill-blank-input').focus();
                }
            }

            document.getElementById('prevBtn').disabled = currentIndex === 0;
            if (currentIndex === questions.length - 1 && userAnswers.every(a => a !== null && a !== '')) {
                document.getElementById('nextBtn').classList.add('hidden');
                document.getElementById('submitAllBtn').classList.remove('hidden');
            } else {
                document.getElementById('nextBtn').classList.remove('hidden');
                document.getElementById('submitAllBtn').classList.add('hidden');
            }
        }
        
        function handleFillBlankInput(value) {
            userAnswers[currentIndex] = value;
            renderQuestion();
            updateAnswerCards();
            updateStatus();
        }

        function submitFillBlankAnswer() { if (isSubmitted || questionAnswered[currentIndex]) return; if (!userAnswers[currentIndex] || !userAnswers[currentIndex].trim()) return; questionAnswered[currentIndex] = true; renderQuestion(); updateAnswerCards(); updateStatus(); }

        function selectOption(index) {
            if (isSubmitted || questionAnswered[currentIndex]) return;

            const q = questions[currentIndex];

            if (q.type === 1) {
                userAnswers[currentIndex] = index;
            } else {
                if (userAnswers[currentIndex] === null) {
                    userAnswers[currentIndex] = [];
                }
                const idx = userAnswers[currentIndex].indexOf(index);
                if (idx > -1) {
                    userAnswers[currentIndex].splice(idx, 1);
                } else {
                    userAnswers[currentIndex].push(index);
                }
                userAnswers[currentIndex].sort((a, b) => a - b);
            }
            questionAnswered[currentIndex] = true;
            renderQuestion();
            updateAnswerCards();
            updateStatus();
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
                updateAnswerCards();
            }
        }

        function nextQuestion() {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                renderQuestion();
                updateAnswerCards();
            }
        }

        function goToQuestion(index) {
            currentIndex = index;
            renderQuestion();
            updateAnswerCards();
        }

        function updateAnswerCards() {
            const container = document.getElementById('answerCards');
            container.innerHTML = '';
            
            questions.forEach((q, index) => {
                let cardClass = 'w-10 h-10 rounded-xl flex items-center justify-center font-semibold cursor-pointer transition-all';
                
                if (userAnswers[index] !== null) {
                    const isCorrect = isAnswerCorrect(index);
                    cardClass += isCorrect ? ' bg-green-500 text-white' : ' bg-red-500 text-white';
                } else {
                    cardClass += ' bg-gray-200 text-gray-600 hover:bg-gray-300';
                }
                
                if (index === currentIndex) {
                    cardClass += ' ring-2 ring-purple-500';
                }
                
                container.innerHTML += `
                    <div class="${cardClass}" onclick="goToQuestion(${index})" title="第${index + 1}题">
                        ${index + 1}
                    </div>
                `;
            });
        }

        function updateStatus() {
            correctCount = 0;
            wrongCount = 0;
            
            userAnswers.forEach((answer, index) => {
                if (answer !== null && answer !== '') {
                    if (isAnswerCorrect(index)) {
                        correctCount++;
                    } else {
                        wrongCount++;
                    }
                }
            });
            
            document.getElementById('currentQuestionNum').textContent = currentIndex + 1;
            document.getElementById('totalQuestionsNum').textContent = questions.length;
            document.getElementById('correctCount').textContent = correctCount;
            document.getElementById('wrongCount').textContent = wrongCount;
            document.getElementById('unansweredCount').textContent = questions.length - userAnswers.filter(a => a !== null && a !== '').length;
            document.getElementById('progressBar').style.width = `${(userAnswers.filter(a => a !== null && a !== '').length / questions.length) * 100}%`;
        }

        function isAnswerCorrect(questionIndex) {
            const q = questions[questionIndex];
            const userAnswer = userAnswers[questionIndex];
            
            if (q.type === 1) {
                return q.options[userAnswer].isCorrect;
            } else if (q.type === 2) {
                const correctIndices = q.options.reduce((acc, opt, idx) => {
                    if (opt.isCorrect) acc.push(idx);
                    return acc;
                }, []);
                
                if (userAnswer.length !== correctIndices.length) return false;
                return userAnswer.every(idx => correctIndices.includes(idx));
            } else if (q.type === 3) {
                return q.blanks.some(blank => userAnswer.trim().toLowerCase() === String(blank).toLowerCase());
            } else if (q.type === 4) {
                return q.options[userAnswer].isCorrect;
            }
        }

        function submitAll() {
            isSubmitted = true;
            showResults();
        }

        function showResults() { 
            const wrongQuestions = [];
            const allQuestionsAnalysis = [];
            
            // 遍历所有题目
            userAnswers.forEach((answer, index) => {
                const q = questions[index];
                const isCorrect = isAnswerCorrect(index);
                let userAnswerText, correctAnswerText;
                
                // 选择题答案处理
                if (q.type === 1) {
                    userAnswerText = q.options[answer] ? q.options[answer].text : '未作答';
                    correctAnswerText = q.options.filter(o => o.isCorrect).map(o => o.text).join('、');
                } else if (q.type === 2) {
                    userAnswerText = answer && answer.length > 0 ? answer.map(i => q.options[i].text).join('、') : '未作答';
                    correctAnswerText = q.options.filter(o => o.isCorrect).map(o => o.text).join('、');
                } else if (q.type === 3) {
                    userAnswerText = answer || '未作答';
                    correctAnswerText = q.blanks.join(' 或 ');
                } else if (q.type === 4) {
                    userAnswerText = q.options[answer] ? q.options[answer].text : '未作答';
                    correctAnswerText = q.options.filter(o => o.isCorrect).map(o => o.text).join('、');
                }
                
                // 收集错题
                if (answer !== null && answer !== '' && !isCorrect) {
                    wrongQuestions.push({
                        questionId: q.id,
                        question: q.type === 3 ? q.code : q.question,
                        userAnswer: userAnswerText,
                        correctAnswer: correctAnswerText,
                        explanation: q.explanation,
                        type: q.type
                    });
                }
                
                // 收集所有题目的解析
                allQuestionsAnalysis.push({
                    index: index,
                    id: q.id,
                    title: q.title,
                    type: q.type,
                    question: q.type === 3 ? q.code : q.question,
                    userAnswer: userAnswerText,
                    correctAnswer: correctAnswerText,
                    explanation: q.explanation,
                    isCorrect: isCorrect && answer !== null && answer !== ''
                });
            });
            
            StorageManager.saveQuizResult(COURSE_ID, { score: correctCount, total: questions.length, wrongQuestions: wrongQuestions });
            
            // 显示结果统计
            document.getElementById('resultSection').classList.remove('hidden'); 
            document.querySelector('section.py-12').classList.add('hidden'); 
            const score = correctCount; 
            const total = questions.length; 
            const rate = Math.round((score / total) * 100); 
            document.getElementById('finalScore').textContent = `${score}/${total}`; 
            document.getElementById('finalCorrect').textContent = correctCount; 
            document.getElementById('finalWrong').textContent = wrongCount; 
            document.getElementById('finalRate').textContent = `${rate}%`; 
            let grade = ''; let message = ''; let icon = ''; 
            if (rate >= 90) { grade = '优秀'; message = '太棒了！你对数据采集与处理技术掌握得非常扎实！'; icon = '🏆'; } 
            else if (rate >= 80) { grade = '良好'; message = '非常出色！继续保持！'; icon = '🎉'; } 
            else if (rate >= 70) { grade = '中等'; message = '不错！还有一些细节需要加强。'; icon = '👍'; } 
            else if (rate >= 60) { grade = '及格'; message = '刚好及格，建议复习一下。'; icon = '💪'; } 
            else { grade = '需努力'; message = '加油！多做练习，你会进步的！'; icon = '📚'; } 
            document.getElementById('resultIcon').textContent = icon; 
            document.getElementById('finalGrade').textContent = grade; 
            document.getElementById('finalGrade').className = `font-bold text-2xl ${rate >= 90 ? 'text-green-600' : rate >= 70 ? 'text-blue-600' : rate >= 60 ? 'text-yellow-600' : 'text-red-600'}`; 
            document.getElementById('gradeMessage').textContent = message; 
            
            // 显示所有题目解析（无论对错都显示）
            const allAnalysisContainer = document.getElementById('allQuestionsAnalysis') || createAllAnalysisSection();
            const allAnalysisList = document.getElementById('allAnalysisList');
            allAnalysisList.innerHTML = '';
            
            allQuestionsAnalysis.forEach(item => {
                const isCorrect = item.isCorrect;
                const isFillBlank = item.type === 3;
                const bgColor = isCorrect ? 'bg-green-50' : 'bg-red-50';
                const borderColor = isCorrect ? 'border-green-500' : 'border-red-500';
                const iconSymbol = isCorrect ? '✓' : '✗';
                const iconColor = isCorrect ? 'text-green-500' : 'text-red-500';
                
                let html = `
                    <div class="${bgColor} rounded-xl p-5 border-l-4 ${borderColor} mb-4">
                        <div class="flex items-center justify-between mb-3">
                            <div class="flex items-center">
                                <span class="${iconColor} text-2xl font-bold mr-3">${iconSymbol}</span>
                                <span class="font-semibold text-gray-800">第 ${item.index + 1} 题</span>
                                ${isFillBlank ? '<span class="ml-2 bg-blue-100 text-blue-600 px-2 py-1 rounded text-xs">代码填空</span>' : ''}
                            </div>
                            <span class="text-sm font-medium ${isCorrect ? 'text-green-600' : 'text-red-600'}">${isCorrect ? '正确' : '错误'}</span>
                        </div>
                        <div class="font-semibold text-gray-800 mb-2">${item.title}</div>
                        <div class="mb-3 ${isFillBlank ? '' : 'text-gray-700'}">${isFillBlank ? `<pre class="bg-gray-900 text-green-400 p-3 rounded text-sm overflow-x-auto">${item.question}</pre>` : item.question}</div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-sm mb-3">
                            <div>
                                <span class="text-red-600"><strong>你的答案：</strong></span>
                                <span class="text-gray-700">${item.userAnswer}</span>
                            </div>
                            <div>
                                <span class="text-green-600"><strong>正确答案：</strong></span>
                                <span class="text-gray-700">${item.correctAnswer}</span>
                            </div>
                        </div>
                        <div class="bg-white/70 p-3 rounded-lg border border-gray-200">
                            <p class="text-purple-700 text-sm"><i class="fa fa-lightbulb-o mr-1"></i><strong>解析：</strong>${item.explanation}</p>
                        </div>
                    </div>`;
                allAnalysisList.innerHTML += html;
            });
            
            document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth' }); 
        }
        
        function createAllAnalysisSection() {
            const container = document.getElementById('resultSection');
            const section = document.createElement('div');
            section.id = 'allQuestionsAnalysis';
            section.className = 'container mx-auto px-4 py-12';
            section.innerHTML = `
                <div class="max-w-4xl mx-auto">
                    <h2 class="text-2xl font-bold mb-6 text-purple-700 text-center">
                        <i class="fa fa-list-alt mr-2"></i>所有题目解析
                    </h2>
                    <div id="allAnalysisList"></div>
                </div>
            `;
            container.appendChild(section);
            return section;
        }

        function restartQuiz() {
            currentIndex = 0;
            userAnswers = new Array(questions.length).fill(null);
            correctCount = 0;
            wrongCount = 0;
            isSubmitted = false;
            questionAnswered = new Array(questions.length).fill(false);
            document.getElementById('resultSection').classList.add('hidden');
            document.querySelector('section.py-12').classList.remove('hidden');
            document.getElementById('progressBar').style.width = '0%';

            init();
        }

        function toggleMobileMenu() {
            document.getElementById('mobileMenu').classList.toggle('hidden');
        }
        
        // 收藏功能
        function getFavorites() {
            return JSON.parse(localStorage.getItem('favorites_' + COURSE_ID) || '[]');
        }
        
        function saveFavorites(favorites) {
            localStorage.setItem('favorites_' + COURSE_ID, JSON.stringify(favorites));
        }
        
        function isFavorite(questionIndex) {
            return getFavorites().includes(questionIndex);
        }
        
        function toggleFavorite(questionIndex) {
            let favorites = getFavorites();
            const idx = favorites.indexOf(questionIndex);
            if (idx > -1) {
                favorites.splice(idx, 1);
            } else {
                favorites.push(questionIndex);
            }
            saveFavorites(favorites);
            renderQuestion();
        }
        
        // 键盘快捷键
        document.addEventListener('keydown', function(e) {
            if (isSubmitted) return;
            const q = questions[currentIndex];
            
            // 1-4选择选项
            if (e.key >= '1' && e.key <= '4') {
                const optionIndex = parseInt(e.key) - 1;
                if (q && (q.type === 1 || q.type === 4) && !questionAnswered[currentIndex]) {
                    selectOption(optionIndex);
                }
            }
            
            // Enter提交填空题
            if (e.key === 'Enter' && q.type === 3 && !questionAnswered[currentIndex]) {
                submitFillBlankAnswer();
            }
            
            // 左右箭头切换题目
            if (e.key === 'ArrowLeft') {
                prevQuestion();
            }
            if (e.key === 'ArrowRight') {
                nextQuestion();
            }
            
            // Escape标记当前题（类似收藏）
            if (e.key === 'Escape') {
                toggleFavorite(currentIndex);
            }
        });

        init();
    </script>
</body>
</html>
