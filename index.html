<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>袁佳琪 - 个人页面</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans SC', sans-serif;
        }
        
        .course-card {
            transition: transform 0.3s ease;
        }
        
        .course-card:hover {
            transform: translateY(-5px);
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- 导航栏 -->
    <nav class="bg-white shadow-md">
        <div class="container mx-auto px-4 py-3">
            <div class="flex justify-between items-center">
                <a href="index.html" class="text-xl font-bold text-blue-600">袁佳琪的个人页面</a>
                <div class="hidden md:flex space-x-6">
                    <a href="index.html" class="text-gray-700 hover:text-blue-600 transition-colors">首页</a>
                    <a href="#courses" class="text-gray-700 hover:text-blue-600 transition-colors">课程</a>
                    <a href="learning-path.html" class="text-gray-700 hover:text-blue-600 transition-colors">学习路径</a>
                </div>
                <button class="md:hidden text-gray-700">
                    <i class="fa fa-bars"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- 个人信息横幅 -->
    <header class="bg-blue-600 text-white py-16">
        <div class="container mx-auto px-4 text-center">
            <h1 class="text-4xl md:text-5xl font-bold mb-4">袁佳琪</h1>
            <p class="text-xl md:text-2xl mb-6">广东科学技术职业学院</p>
            <p class="text-lg md:text-xl">商学院 - 商务数据分析与应用专业</p>
        </div>
    </header>

    <!-- 课程列表 -->
    <section id="courses" class="py-12">
        <div class="container mx-auto px-4">
            <h2 class="text-3xl font-bold text-center mb-10 text-gray-800">我的课程</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                <!-- Python基础 -->
                <a href="courses/python-basics.html" class="course-card bg-white rounded-lg shadow-md p-6">
                    <div class="text-blue-600 text-4xl mb-4">
                        <i class="fa fa-code"></i>
                    </div>
                    <h3 class="text-xl font-semibold mb-2">Python基础</h3>
                    <p class="text-gray-600">学习Python编程语言的基础知识和应用</p>
                </a>
                
                <!-- 数据分析技术 -->
                <a href="courses/data-analysis.html" class="course-card bg-white rounded-lg shadow-md p-6">
                    <div class="text-blue-600 text-4xl mb-4">
                        <i class="fa fa-bar-chart"></i>
                    </div>
                    <h3 class="text-xl font-semibold mb-2">数据分析技术</h3>
                    <p class="text-gray-600">掌握数据分析的基本方法和工具</p>
                </a>
                
                <!-- 数据采集与处理 -->
                <a href="courses/data-collection.html" class="course-card bg-white rounded-lg shadow-md p-6">
                    <div class="text-blue-600 text-4xl mb-4">
                        <i class="fa fa-database"></i>
                    </div>
                    <h3 class="text-xl font-semibold mb-2">数据采集与处理</h3>
                    <p class="text-gray-600">学习数据采集、清洗和预处理技术</p>
                </a>
                
                <!-- 供应链数据分析 -->
                <a href="courses/supply-chain.html" class="course-card bg-white rounded-lg shadow-md p-6">
                    <div class="text-blue-600 text-4xl mb-4">
                        <i class="fa fa-truck"></i>
                    </div>
                    <h3 class="text-xl font-semibold mb-2">供应链数据分析</h3>
                    <p class="text-gray-600">分析供应链数据，优化供应链管理</p>
                </a>
                
                <!-- 数据库原理与应用 -->
                <a href="courses/database.html" class="course-card bg-white rounded-lg shadow-md p-6">
                    <div class="text-blue-600 text-4xl mb-4">
                        <i class="fa fa-server"></i>
                    </div>
                    <h3 class="text-xl font-semibold mb-2">数据库原理与应用</h3>
                    <p class="text-gray-600">学习数据库设计和SQL查询</p>
                </a>
            </div>
        </div>
    </section>

    <!-- 页脚 -->
    <footer class="bg-gray-800 text-white py-8">
        <div class="container mx-auto px-4 text-center">
            <p>&copy; 2026 袁佳琪的个人页面</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
