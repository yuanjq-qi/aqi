<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据分析练习 - 袁佳琪的个人页面</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans SC', sans-serif;
        }
        
        .question-card {
            transition: box-shadow 0.3s ease;
        }
        
        .question-card:hover {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }
        
        .option-btn {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .option-btn:hover:not(.correct):not(.wrong):not(:disabled) {
            transform: translateX(5px);
            border-color: #a855f7;
            background-color: #f3e8ff;
        }
        
        .correct {
            background-color: #dcfce7 !important;
            border-color: #22c55e !important;
        }
        
        .wrong {
            background-color: #fee2e2 !important;
            border-color: #ef4444 !important;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-pink-50 via-purple-50 to-blue-50">
    <!-- 导航栏 -->
    <nav class="bg-white/80 backdrop-blur-md shadow-md">
        <div class="container mx-auto px-4 py-3">
            <div class="flex justify-between items-center">
                <a href="../index.html" class="text-xl font-bold text-purple-500">袁佳琪的个人页面</a>
                <div class="hidden md:flex space-x-6">
                    <a href="../index.html" class="text-gray-700 hover:text-purple-500 transition-colors">首页</a>
                    <a href="../index.html#courses" class="text-gray-700 hover:text-purple-500 transition-colors">课程</a>
                    <a href="../learning-path.html" class="text-gray-700 hover:text-purple-500 transition-colors">学习路径</a>
                </div>
                <button class="md:hidden text-gray-700">
                    <i class="fa fa-bars"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- 练习标题 -->
    <header class="bg-gradient-to-r from-pink-400 via-purple-400 to-blue-400 text-white py-12">
        <div class="container mx-auto px-4 text-center">
            <h1 class="text-3xl md:text-4xl font-bold mb-4">数据分析练习</h1>
            <div class="flex justify-center items-center space-x-4">
                <span id="currentQuestion" class="text-2xl font-bold">1</span>
                <span class="text-lg">/</span>
                <span id="totalQuestions" class="text-lg">5</span>
                <span class="text-lg ml-4">| 得分: <span id="score">0</span>/5</span>
            </div>
        </div>
    </header>

    <!-- 进度条 -->
    <div class="bg-purple-200 h-2">
        <div id="progressBar" class="bg-gradient-to-r from-pink-400 to-purple-500 h-2 transition-all duration-500" style="width: 20%"></div>
    </div>

    <!-- 练习内容 -->
    <section class="py-12">
        <div class="container mx-auto px-4">
            <div class="max-w-3xl mx-auto">
                <!-- 问题卡片 -->
                <div id="questionContainer" class="question-card bg-white rounded-2xl shadow-lg p-8 mb-8 border border-purple-100">
                    <!-- 问题会通过JavaScript动态加载 -->
                </div>

                <!-- 导航按钮 -->
                <div class="flex flex-wrap justify-between gap-4">
                    <button id="prevBtn" class="bg-gray-400 text-white px-6 py-3 rounded-xl hover:bg-gray-500 transition-colors flex items-center disabled:opacity-50 disabled:cursor-not-allowed">
                        <i class="fa fa-arrow-left mr-2"></i>上一题
                    </button>
                    <a href="../learning-path.html" class="bg-gray-200 text-gray-700 px-6 py-3 rounded-xl hover:bg-gray-300 transition-colors flex items-center">
                        <i class="fa fa-home mr-2"></i>返回学习路径
                    </a>
                    <button id="nextBtn" class="bg-gradient-to-r from-pink-400 to-purple-500 text-white px-6 py-3 rounded-xl hover:from-pink-500 hover:to-purple-600 transition-colors flex items-center shadow-md">
                        下一题<i class="fa fa-arrow-right ml-2"></i>
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- 页脚 -->
    <footer class="bg-gradient-to-r from-purple-500 to-pink-500 text-white py-8 mt-12">
        <div class="container mx-auto px-4 text-center">
            <p>&copy; 2026 袁佳琪的个人页面</p>
        </div>
    </footer>

    <script>
        const questions = [
            {
                id: 1,
                type: 'choice',
                title: '问题 1：数据描述性统计',
                question: '给定数据 [85, 92, 78, 88, 95, 72, 89, 90, 82, 87]，其平均值是多少？',
                options: ['84.8', '85.8', '86.8', '87.8'],
                answer: 1,
                explanation: '计算过程：(85+92+78+88+95+72+89+90+82+87) ÷ 10 = 858 ÷ 10 = 85.8'
            },
            {
                id: 2,
                type: 'choice',
                title: '问题 2：中位数计算',
                question: '给定数据 [12, 15, 18, 20, 25, 30]，其中位数是？',
                options: ['18', '19', '20', '22.5'],
                answer: 1,
                explanation: '中位数是排序后中间两个数的平均值：(18+20) ÷ 2 = 19'
            },
            {
                id: 3,
                type: 'choice',
                title: '问题 3：数据分布',
                question: '在数据分析中，标准差主要用来衡量什么？',
                options: ['数据的平均值', '数据的离散程度', '数据的最大值', '数据的中位数'],
                answer: 1,
                explanation: '标准差是衡量数据离散程度或变异性的统计量，值越大表示数据越分散。'
            },
            {
                id: 4,
                type: 'choice',
                title: '问题 4：相关分析',
                question: '当两个变量的相关系数为0.8时，表示两者之间存在？',
                options: ['弱正相关', '强正相关', '弱负相关', '强负相关'],
                answer: 1,
                explanation: '相关系数范围为[-1, 1]，0.8接近1，表示存在强正相关关系。'
            },
            {
                id: 5,
                type: 'choice',
                title: '问题 5：数据可视化',
                question: '以下哪种图表最适合展示数据的分布情况？',
                options: ['折线图', '柱状图', '直方图', '散点图'],
                answer: 2,
                explanation: '直方图专门用于展示数据的分布情况，通过分组显示数据的频率分布。'
            }
        ];

        let currentIndex = 0;
        let score = 0;
        let answered = false;

        function renderQuestion() {
            const question = questions[currentIndex];
            const container = document.getElementById('questionContainer');
            
            let html = `
                <h2 class="text-2xl font-semibold mb-6 text-gray-800">${question.title}</h2>
                <div class="mb-8">
                    <p class="text-gray-700 text-lg mb-6">${question.question}</p>
                    <div class="space-y-3">
            `;
            
            question.options.forEach((option, index) => {
                html += `
                    <button 
                        class="option-btn w-full text-left p-4 border-2 border-gray-200 rounded-xl transition-all"
                        onclick="checkAnswer(${index})"
                        id="option-${index}"
                    >
                        <span class="font-semibold mr-3">${['A', 'B', 'C', 'D'][index]}.</span>
                        ${option}
                    </button>
                `;
            });
            
            html += `
                    </div>
                    <div id="explanation" class="mt-6 p-4 bg-purple-50 rounded-xl hidden border-l-4 border-purple-500">
                        <p class="text-gray-700"><strong class="text-purple-600">解析：</strong>${question.explanation}</p>
                    </div>
                </div>
            `;
            
            container.innerHTML = html;
            
            document.getElementById('prevBtn').disabled = currentIndex === 0;
            document.getElementById('nextBtn').disabled = !answered;
            
            document.getElementById('currentQuestion').textContent = currentIndex + 1;
            document.getElementById('score').textContent = score;
            document.getElementById('progressBar').style.width = `${((currentIndex + 1) / questions.length) * 100}%`;
        }

        function checkAnswer(selectedIndex) {
            if (answered) return;
            
            const question = questions[currentIndex];
            const optionButtons = document.querySelectorAll('.option-btn');
            
            optionButtons.forEach(btn => btn.disabled = true);
            
            optionButtons.forEach((btn, index) => {
                if (index === question.answer) {
                    btn.classList.add('correct');
                } else if (index === selectedIndex && index !== question.answer) {
                    btn.classList.add('wrong');
                }
            });
            
            document.getElementById('explanation').classList.remove('hidden');
            
            if (selectedIndex === question.answer) {
                score++;
                document.getElementById('score').textContent = score;
            }
            
            answered = true;
            document.getElementById('nextBtn').disabled = false;
        }

        document.getElementById('prevBtn').addEventListener('click', function() {
            if (currentIndex > 0) {
                currentIndex--;
                answered = false;
                renderQuestion();
            }
        });

        document.getElementById('nextBtn').addEventListener('click', function() {
            if (!answered) return;
            
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                answered = false;
                renderQuestion();
            } else {
                showResult();
            }
        });

        function showResult() {
            const container = document.getElementById('questionContainer');
            const percentage = Math.round((score / questions.length) * 100);
            
            let grade = '';
            let message = '';
            
            if (percentage >= 90) {
                grade = '优秀';
                message = '太棒了！你对数据分析知识掌握得很好！';
            } else if (percentage >= 70) {
                grade = '良好';
                message = '不错！继续加油，巩固一下薄弱环节。';
            } else if (percentage >= 60) {
                grade = '及格';
                message = '及格了！建议复习一下基础知识。';
            } else {
                grade = '需努力';
                message = '加油！多做练习，你会进步的！';
            }
            
            container.innerHTML = `
                <div class="text-center py-12">
                    <div class="text-6xl mb-6">${percentage >= 60 ? '🎉' : '💪'}</div>
                    <h2 class="text-3xl font-bold mb-4 text-purple-700">练习完成！</h2>
                    <div class="text-xl mb-2">你的得分：<span class="font-bold text-pink-600">${score}/${questions.length}</span></div>
                    <div class="text-xl mb-4">正确率：<span class="font-bold text-purple-600">${percentage}%</span></div>
                    <div class="text-xl mb-8">评级：<span class="font-bold text-green-600">${grade}</span></div>
                    <p class="text-gray-600 mb-8">${message}</p>
                    <div class="flex flex-wrap justify-center gap-4">
                        <button onclick="restart()" class="bg-gradient-to-r from-purple-500 to-pink-500 text-white px-6 py-3 rounded-xl hover:from-purple-600 hover:to-pink-600 transition-colors shadow-md">
                            重新练习
                        </button>
                        <a href="../learning-path.html" class="bg-gray-200 text-gray-700 px-6 py-3 rounded-xl hover:bg-gray-300 transition-colors inline-block">
                            返回学习路径
                        </a>
                    </div>
                </div>
            `;
            
            document.getElementById('prevBtn').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'none';
        }

        function restart() {
            currentIndex = 0;
            score = 0;
            answered = false;
            document.getElementById('prevBtn').style.display = 'flex';
            document.getElementById('nextBtn').style.display = 'flex';
            renderQuestion();
        }

        renderQuestion();
    </script>
</body>
</html>
