<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据分析练习 - 袁佳琪的个人页面</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans SC', sans-serif;
        }
        
        .question-card {
            transition: box-shadow 0.3s ease;
        }
        
        .question-card:hover {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- 导航栏 -->
    <nav class="bg-white shadow-md">
        <div class="container mx-auto px-4 py-3">
            <div class="flex justify-between items-center">
                <a href="../index.html" class="text-xl font-bold text-blue-600">袁佳琪的个人页面</a>
                <div class="hidden md:flex space-x-6">
                    <a href="../index.html" class="text-gray-700 hover:text-blue-600 transition-colors">首页</a>
                    <a href="../index.html#courses" class="text-gray-700 hover:text-blue-600 transition-colors">课程</a>
                    <a href="../learning-path.html" class="text-gray-700 hover:text-blue-600 transition-colors">学习路径</a>
                </div>
                <button class="md:hidden text-gray-700">
                    <i class="fa fa-bars"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- 练习标题 -->
    <header class="bg-blue-600 text-white py-12">
        <div class="container mx-auto px-4 text-center">
            <h1 class="text-3xl md:text-4xl font-bold mb-4">数据分析练习</h1>
            <p class="text-lg md:text-xl">第 1 题 / 共 5 题</p>
        </div>
    </header>

    <!-- 练习内容 -->
    <section class="py-12">
        <div class="container mx-auto px-4">
            <div class="max-w-3xl mx-auto">
                <!-- 问题卡片 -->
                <div class="question-card bg-white rounded-lg shadow-md p-8 mb-8">
                    <h2 class="text-2xl font-semibold mb-6 text-gray-800">问题 1：基础数据描述性统计</h2>
                    <div class="mb-8">
                        <p class="text-gray-700 text-lg mb-4">给定以下学生成绩数据，请完成以下分析：</p>
                        <div class="bg-gray-50 rounded-lg p-4 mb-6">
                            <pre class="text-sm">
学生成绩数据：[85, 92, 78, 88, 95, 72, 89, 90, 82, 87]
                            </pre>
                        </div>
                        <ol class="list-decimal pl-6 mb-6 text-gray-700 space-y-2">
                            <li>计算这组数据的平均值</li>
                            <li>计算这组数据的中位数</li>
                            <li>找出这组数据的最高分和最低分</li>
                            <li>计算这组数据的范围（最高分-最低分）</li>
                        </ol>
                    </div>
                    <div class="bg-gray-50 rounded-lg p-6">
                        <h3 class="font-semibold text-gray-800 mb-4">分析结果：</h3>
                        <ul class="list-disc pl-6 text-gray-700 space-y-2">
                            <li>平均分：85.8</li>
                            <li>中位数：87</li>
                            <li>最高分：95，最低分：72</li>
                            <li>范围：23</li>
                        </ul>
                    </div>
                </div>

                <!-- 导航按钮 -->
                <div class="flex justify-between">
                    <button id="prevBtn" class="bg-gray-500 text-white px-6 py-3 rounded-lg hover:bg-gray-600 transition-colors flex items-center">
                        <i class="fa fa-arrow-left mr-2"></i>上一题
                    </button>
                    <a href="../learning-path.html" class="bg-gray-200 text-gray-700 px-6 py-3 rounded-lg hover:bg-gray-300 transition-colors flex items-center">
                        <i class="fa fa-arrow-left mr-2"></i>返回学习路径
                    </a>
                    <button id="nextBtn" class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition-colors flex items-center">
                        下一题<i class="fa fa-arrow-right ml-2"></i>
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- 页脚 -->
    <footer class="bg-gray-800 text-white py-8 mt-12">
        <div class="container mx-auto px-4 text-center">
            <p>&copy; 2026 袁佳琪的个人页面</p>
        </div>
    </footer>

    <script>
        // 简单的题目导航逻辑
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        
        // 第一题禁用上一题按钮
        prevBtn.disabled = true;
        prevBtn.classList.add('opacity-50', 'cursor-not-allowed');
        
        // 点击下一题
        nextBtn.addEventListener('click', function() {
            alert('恭喜你！这是第一题，你可以继续添加更多题目！');
        });
    </script>
</body>
</html>
